const diagnosticQuestions=[{"id":"d01","discipline":"Língua Portuguesa","area":"Interpretação","topic":"Ideia central","q":"Leia: “Estudar com regularidade costuma produzir resultados mais consistentes do que concentrar todo o esforço na véspera de uma prova.” A ideia central do trecho é que:","opts":["estudar apenas na véspera é mais eficiente.","a regularidade tende a favorecer resultados consistentes.","todo estudo deve ocorrer diariamente por muitas horas.","provas medem apenas memória de curto prazo.","o tempo de estudo não interfere no resultado."],"a":1,"ex":"O trecho compara duas formas de estudar e valoriza a regularidade.","map":["ideia central","interpretação"]},{"id":"d02","discipline":"Língua Portuguesa","area":"Coesão","topic":"Referência pronominal","q":"Em “A professora apresentou a proposta aos estudantes e eles fizeram sugestões”, o pronome “eles” retoma:","opts":["a professora.","a proposta.","os estudantes.","as sugestões.","a apresentação."],"a":2,"ex":"“Eles” é um mecanismo de coesão referencial que retoma “os estudantes”.","map":["coesão referencial","pronomes"]},{"id":"d03","discipline":"Língua Portuguesa","area":"Coesão","topic":"Conectivos","q":"Na frase “O conteúdo era extenso, mas o candidato manteve o planejamento”, a palavra “mas” estabelece relação de:","opts":["causa.","conclusão.","adição.","oposição.","explicação."],"a":3,"ex":"“Mas” é uma conjunção adversativa e marca contraste/oposição.","map":["conectores","conjunções"]},{"id":"d04","discipline":"Língua Portuguesa","area":"Pontuação","topic":"Vocativo","q":"Assinale a frase em que a vírgula está empregada para separar um vocativo.","opts":["Marina, revise este tópico antes do simulado.","Marina revisou este tópico antes do simulado.","Antes do simulado, Marina revisou o tópico.","Marina revisou, com atenção, todo o tópico.","O tópico que Marina revisou era curto."],"a":0,"ex":"Em “Marina, revise...”, “Marina” é o termo usado para chamar/interpelar o interlocutor.","map":["pontuação","vocativo"]},{"id":"d05","discipline":"Língua Portuguesa","area":"Norma culta","topic":"Crase","q":"Assinale a alternativa em que o emprego da crase está adequado à norma-padrão.","opts":["O professor entregou o material à todos.","A candidata dirigiu-se à escola para a prova.","Ele começou à estudar pela manhã.","O aviso foi enviado à partir das oito horas.","O candidato ficou frente à frente com o fiscal."],"a":1,"ex":"Em “dirigiu-se à escola”, ocorre a fusão da preposição “a” com o artigo feminino “a”.","map":["crase"]},{"id":"d06","discipline":"Língua Portuguesa","area":"Sintaxe","topic":"Concordância verbal","q":"Assinale a frase de acordo com a norma-padrão de concordância verbal.","opts":["Fazem dois meses que comecei a estudar.","Houveram muitas dúvidas na revisão.","Existe bons materiais gratuitos.","Faltam três capítulos para concluir o módulo.","Deve haverem novas questões amanhã."],"a":3,"ex":"O verbo concorda com o sujeito “três capítulos”: “faltam três capítulos”.","map":["concordância","organização sintática"]},{"id":"d07","discipline":"Língua Portuguesa","area":"Semântica","topic":"Ambiguidade","q":"Qual frase apresenta ambiguidade de sentido?","opts":["O aluno resolveu dez questões pela manhã.","A professora explicou a regra com clareza.","Vi o coordenador com o binóculo.","O concurso ocorrerá no domingo.","Os candidatos chegaram cedo ao local."],"a":2,"ex":"Não fica claro se quem usava o binóculo era o observador ou o coordenador.","map":["ambiguidade","semântica"]},{"id":"d08","discipline":"Língua Portuguesa","area":"Semântica","topic":"Denotação e conotação","q":"Na frase “Depois de muitos erros, ele finalmente viu a luz”, a expressão “viu a luz” foi usada principalmente em sentido:","opts":["denotativo, indicando iluminação física.","conotativo, indicando compreensão ou solução.","técnico, indicando energia elétrica.","jurídico, indicando autorização.","literal, indicando mudança de sala."],"a":1,"ex":"A expressão foi usada figuradamente para indicar compreensão, descoberta ou solução.","map":["sentido próprio e figurado","conotação"]},{"id":"d09","discipline":"Língua Portuguesa","area":"Classes de palavras","topic":"Advérbio","q":"Na frase “A candidata respondeu rapidamente”, a palavra “rapidamente” funciona como:","opts":["substantivo.","adjetivo.","pronome.","advérbio.","preposição."],"a":3,"ex":"“Rapidamente” modifica o verbo “respondeu”, indicando modo.","map":["advérbios","classes de palavras"]},{"id":"d10","discipline":"Língua Portuguesa","area":"Tipologia textual","topic":"Injunção","q":"Um texto que apresenta passos para preencher corretamente um formulário tem predominância do modo:","opts":["narrativo.","descritivo.","injuntivo.","lírico.","argumentativo."],"a":2,"ex":"Textos injuntivos orientam ações por meio de instruções, comandos ou procedimentos.","map":["injunção","modos de organização discursiva"]},{"id":"d11","discipline":"Raciocínio Lógico","area":"Lógica proposicional","topic":"Negação","q":"A negação lógica de “Todos os candidatos revisaram Física” é:","opts":["Nenhum candidato revisou Física.","Todos os candidatos não revisaram Física.","Pelo menos um candidato não revisou Física.","Pelo menos um candidato revisou Física.","Alguns candidatos revisaram todas as disciplinas."],"a":2,"ex":"Negar uma afirmação universal significa afirmar que existe pelo menos um caso que não a satisfaz.","map":["negação","proposições"]},{"id":"d12","discipline":"Raciocínio Lógico","area":"Raciocínio quantitativo","topic":"Porcentagem","q":"Em uma lista de 250 questões, uma candidata resolveu 20%. Quantas questões ela resolveu?","opts":["25","40","50","60","75"],"a":2,"ex":"20% de 250 = 0,20 × 250 = 50.","map":["porcentagem"]},{"id":"d13","discipline":"Raciocínio Lógico","area":"Raciocínio quantitativo","topic":"Proporção","q":"Mantendo o mesmo ritmo, uma pessoa resolve 45 questões em 3 horas. Em 5 horas, resolverá:","opts":["60","65","70","75","90"],"a":3,"ex":"45 ÷ 3 = 15 questões por hora; em 5 horas, 15 × 5 = 75.","map":["proporção","regra de três"]},{"id":"d14","discipline":"Raciocínio Lógico","area":"Padrões","topic":"Sequência lógica","q":"Observe a sequência 2, 5, 8, 11, ... O próximo termo é:","opts":["12","13","14","15","16"],"a":2,"ex":"A sequência aumenta de 3 em 3: 11 + 3 = 14.","map":["sequências","padrões"]},{"id":"d15","discipline":"Raciocínio Lógico","area":"Diagramas","topic":"Conjuntos e Venn","q":"Em um grupo, 30 pessoas estudam Física, 20 estudam Matemática e 10 estudam as duas disciplinas. Quantas estudam pelo menos uma das duas?","opts":["30","40","50","60","70"],"a":1,"ex":"Pelo princípio da inclusão-exclusão: 30 + 20 − 10 = 40.","map":["Venn","diagramas lógicos"]},{"id":"d16","discipline":"Atualidades","area":"Pará","topic":"Organização político-administrativa","q":"A capital do Estado do Pará é:","opts":["Santarém.","Marabá.","Belém.","Altamira.","Castanhal."],"a":2,"ex":"Belém é a capital do Estado do Pará.","map":["organização político-administrativa","formação territorial"]},{"id":"d17","discipline":"Atualidades","area":"Pará","topic":"Logística e integração regional","q":"Em um estado amazônico de grande extensão territorial e ampla rede hidrográfica, uma política de integração regional deve considerar especialmente:","opts":["somente transporte aéreo.","a combinação de diferentes modais e as características territoriais.","a eliminação do transporte fluvial.","apenas deslocamentos dentro da capital.","a substituição de toda infraestrutura rodoviária por ferrovias."],"a":1,"ex":"A integração regional depende de soluções multimodais adequadas às distâncias, rios, cidades e características do território.","map":["logística","integração regional"]},{"id":"d18","discipline":"Atualidades","area":"Sociedade e cultura","topic":"Povos e comunidades tradicionais","q":"Ao tratar da diversidade social do Pará, uma abordagem adequada reconhece que:","opts":["povos indígenas, quilombolas e populações tradicionais integram a diversidade sociocultural do estado.","somente áreas urbanas produzem cultura contemporânea.","as comunidades tradicionais não participam da economia regional.","diversidade cultural e políticas públicas são assuntos sem relação.","a cultura estadual é homogênea em todo o território."],"a":0,"ex":"O edital destaca explicitamente povos indígenas, comunidades quilombolas e populações tradicionais como parte da diversidade do Pará.","map":["diversidade cultural","povos indígenas","quilombolas"]},{"id":"d19","discipline":"Atualidades","area":"Meio ambiente","topic":"Desenvolvimento sustentável","q":"Uma proposta coerente com o desenvolvimento sustentável na Amazônia busca:","opts":["impedir qualquer atividade econômica.","ampliar a exploração de recursos sem controle.","conciliar atividades econômicas, conservação ambiental e bem-estar social.","substituir políticas ambientais por ações exclusivamente privadas.","considerar apenas o crescimento do PIB."],"a":2,"ex":"Desenvolvimento sustentável envolve articular dimensões econômica, ambiental e social.","map":["sustentabilidade","desenvolvimento sustentável"]},{"id":"d20","discipline":"Atualidades","area":"Cultura","topic":"Patrimônio material e imaterial","q":"Assinale a alternativa que melhor distingue patrimônio material de patrimônio imaterial.","opts":["O material é necessariamente antigo; o imaterial é sempre recente.","O material envolve bens físicos; o imaterial inclui saberes, celebrações e práticas culturais.","O material pertence apenas ao Estado; o imaterial apenas a indivíduos.","O imaterial não pode ser protegido por políticas culturais.","Não existe diferença entre os dois conceitos."],"a":1,"ex":"Bens materiais possuem suporte físico; práticas, celebrações, saberes e modos de fazer são exemplos de patrimônio imaterial.","map":["patrimônio material","patrimônio imaterial"]},{"id":"d21","discipline":"Conhecimentos Pedagógicos","area":"Avaliação","topic":"Avaliação diagnóstica","q":"No início de uma unidade, o professor aplica algumas questões para descobrir o que a turma já sabe. Essa avaliação é principalmente:","opts":["somativa.","diagnóstica.","classificatória final.","punitiva.","certificadora."],"a":1,"ex":"A avaliação diagnóstica identifica conhecimentos prévios, lacunas e necessidades antes ou no início do percurso.","map":["avaliação diagnóstica"]},{"id":"d22","discipline":"Conhecimentos Pedagógicos","area":"Avaliação","topic":"Avaliação formativa","q":"Durante as aulas, o professor observa as dificuldades, devolve orientações e ajusta as atividades. Essa prática caracteriza sobretudo avaliação:","opts":["formativa.","exclusivamente somativa.","apenas normativa.","meramente burocrática.","sem função pedagógica."],"a":0,"ex":"A avaliação formativa acompanha o processo e fornece evidências para ajustar ensino e aprendizagem.","map":["avaliação formativa","feedback"]},{"id":"d23","discipline":"Conhecimentos Pedagógicos","area":"Aprendizagem","topic":"Conhecimentos prévios","q":"Ao iniciar um tema novo, considerar os conhecimentos prévios dos estudantes é importante porque:","opts":["dispensa o planejamento docente.","permite relacionar novas aprendizagens ao que os estudantes já sabem.","torna desnecessária a avaliação.","garante que todos aprendam no mesmo ritmo.","substitui o estudo de novos conceitos."],"a":1,"ex":"Conhecimentos prévios ajudam a construir relações significativas com o novo conteúdo.","map":["aprendizagem significativa","desenvolvimento cognitivo"]},{"id":"d24","discipline":"Conhecimentos Pedagógicos","area":"Inclusão","topic":"Educação inclusiva","q":"Em uma perspectiva inclusiva, diante de diferentes necessidades de aprendizagem, a ação mais adequada é:","opts":["oferecer exatamente o mesmo recurso, sem qualquer adaptação.","reduzir automaticamente os objetivos de todos os estudantes.","planejar acessibilidade, apoios e estratégias que ampliem a participação e a aprendizagem.","separar permanentemente quem apresenta dificuldade.","avaliar somente pela velocidade rículo","topic":"Projeto Político-Pedagógico","q":"O Projeto Político-Pedagógico de uma escola deve ser compreendido como:","opts":["um documento construído coletivamente que orienta identidade, objetivos e ações da escola.","uma lista individual de tarefas do diretor.","um documento sem relação com a comunidade escolar.","um calendário de provas apenas.","um material exclusivo da secretaria de educação."],"a":0,"ex":"O PPP expressa princípios, identidade, objetivos e organização do trabalho da escola e pressupõe construção coletiva.","map":["Projeto Político-Pedagógico","construção coletiva"]},{"id":"d29","discipline":"Conhecimentos Pedagógicos","area":"Neurociência","topic":"Memória e aprendizagem","q":"Do ponto de vista educacional, uma estratégia que tende a favorecer a consolidação da aprendizagem é:","opts":["estudar todo o conteúdo apenas uma vez.","alternar estudo, recuperação da informação e revisões ao longo do tempo.","evitar qualquer tentativa de lembrar sem consultar.","usar somente leitura passiva.","reduzir todo conteúdo a uma única sessão longa."],"a":1,"ex":"Prática de recuperação e revisões distribuídas ajudam a fortalecer a retenção e a aprendizagem.","map":["memória","recuperação","autorregulação"]},{"id":"d30","discipline":"Conhecimentos Pedagógicos","area":"Ética docente","topic":"Relação professor-aluno","q":"Em uma relação pedagógica ética, o professor deve:","opts":["expor publicamente os erros de um estudante para constrangê-lo.","usar critérios diferentes sem justificativa.","estabelecer critérios claros, respeitar os estudantes e usar a autoridade com finalidade educativa.","evitar qualquer diálogo com a turma.","basear a avaliação em preferências pessoais."],"a":2,"ex":"A ética docente envolve respeito, responsabilidade, critérios transparentes e autoridade orientada à aprendizagem.","map":["ética no trabalho docente","relação professor-aluno"]},{"id":"d31","discipline":"Física","area":"Mecânica","topic":"Inércia e 1ª Lei de Newton","q": function remapLegacyTopicId(id){if(!id||topics.some(t=>t.id===id))return id;return topics.find(t=>t.legacyId===id)?.id||id}
function migrateGranularProgress(list){const out=[];(Array.isArray(list)?list:[]).forEach(p=>{if(topics.some(t=>t.id===p.topicId)){out.push(p);return}const children=topics.filter(t=>t.legacyId===p.topicId);if(!children.length){out.push(p);return}const status=p.status==='dominado'?'revisando':p.status==='revisando'?'estudando':p.status;children.forEach(c=>out.push({...p,topicId:c.id,status,updatedAt:null,migratedFrom:p.topicId}))});const map=new Map();out.forEach(p=>map.set(p.topicId,p));return [...map.values()]}
function migrateTopicArray(list){return (Array.isArray(list)?list:[]).map(x=>({...x,topicId:remapLegacyTopicId(x.topicId)}))}
function migrateState(p){if(!p||typeof p!=='object')return defaultState();const base=defaultState();const oldQs=Array.isArray(p.questions)?p.questions:[];const sourceQs=Array.isArray(p.questionSessions)?p.questionSessions:oldQs;const migratedQs=sourceQs.map(q=>{const tid=remapLegacyTopicId(q.topicId||'');const t=topics.find(x=>x.id===tid);return {id:q.id||uid(),topicId:tid,discipline:q.discipline||t?.discipline||'',topicTitle:q.topicTitle||t?.title||'Conteúdo importado',bank:q.bank||'FGV',year:q.year||2026,total:+q.total||0,correct:+q.correct||0,wrong:q.wrong!=null?+q.wrong:Math.max(0,(+q.total||0)-(+q.correct||0)),accuracy:q.accuracy!=null?+q.accuracy:((+q.total||0)?Math.round((+q.correct||0)/(+q.total||1)*100):0),reason:q.reason||'',notes:q.notes||'',date:q.date||today(),createdAt:q.createdAt||new Date().toISOString()}});return {...base,...p,progress:migrateGranularProgress(p.progress),sessions:migrateTopicArray(p.sessions),questionSessions:migratedQs,errors:migrateTopicArray(p.errors),reviews:migrateTopicArray(p.reviews),flashcards:migrateTopicArray(p.flashcards),questionBank:migrateTopicArray(p.questionBank),settings:{...base.settings,...(p.settings||{})},micro:{...base.micro,...(p.micro||{})},diagnostic:{...base.diagnostic,...(p.diagnostic||{}),attempts:Array.isArray(p.diagnostic?.attempts)?p.diagnostic.attempts:[]},pinnedTopics:Array.isArray(p.pinnedTopics)?p.pinnedTopics:[],achievementsSeen:Array.isArray(p.achievementsSeen)?p.achievementsSeen:[],version:'2.8'}}
const DB_NAME="rota-aprovacao-fisica-db",DB_STORE="state",DB_VERSION=1;let storageMode="LocalStorage + IndexedDB",dbReady=false,deferredInstallPrompt=null;
function openAppDB(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window))return reject(new Error('IndexedDB indisponível'));const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function idbWrite(value){try{const db=await openAppDB();await new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(value,APP_KEY);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});dbReady=true;return true}catch(e){storageMode='LocalStorage';return false}}
async function idbRead(){try{const db=await openAppDB();const value=await new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readonly');const r=tx.objectStore(DB_STORE).get(APP_KEY);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});dbReady=true;return value||null}catch(e){storageMode='LocalStorage';return null}}
async function idbClear(){try{const db=await openAppDB();await new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).delete(APP_KEY);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}catch(e){}}
async function initIndexedPersistence(){const dbState=await idbRead();const localRaw=localStorage.getItem(APP_KEY);if(dbState){const localTime=state?.meta?.updatedAt||state?.createdAt||'';const dbTime=dbState?.meta?.updatedAt||dbState?.createdAt||'';if(!localRaw||dbTime>localTime){state=migrateState(dbState);localStorage.setItem(APP_KEY,JSON.stringify(state));applyTheme();render();toast('Progresso restaurado do armazenamento seguro do aplicativo.')}else await idbWrite(state)}else if(localRaw)await idbWrite(state)}
function load(){try{const raw=localStorage.getItem(APP_KEY);if(raw){state=migrateState(JSON.parse(raw))}}catch(e){}applyTheme()}
function save(skipSnapshot=false){state.meta={...(state.meta||{}),updatedAt:new Date().toISOString()};localStorage.setItem(APP_KEY,JSON.stringify(state));idbWrite(state);if(!skipSnapshot)maybeSnapshot();}
function maybeSnapshot(){try{let snaps=JSON.parse(localStorage.getItem(SNAP_KEY)||'[]');const now=new Date(), last=snaps[0]?.at?new Date(snaps[0].at):null;if(!last||now-last>6*3600000){snaps.unshift({at:now.toISOString(),data:JSON.stringify(state)});snaps=snaps.slice(0,5);localStorage.setItem(SNAP_KEY,JSON.stringify(snaps))}}catch(e){}}

function setProgress(id,status){state.progress=state.progress.filter(p=>p.topicId!==id);state.progress.push({topicId:id,status,updatedAt:new Date().toISOString()});if(status!=='nao_iniciado')ensureReview(id);save();}

function masterySuggestion(topic){const p=getProgress(topic.id),acc=accuracyForTopic(topic.id),q=questionCountTopic(topic.id),errs=recentErrorCount(topic.id),review=state.reviews.find(r=>r.topicId===topic.id),overdue=!!(review&&review.due<=today()),days=p.updatedAt?daysBetween(p.updatedAt.slice(0,10),today()):999;let suggested=p.status,reasons=[];
if(p.status==='dominado'&&((q>=5&&acc!==null&&acc<65)||errs>=2||(overdue&&days>10))){suggested='revisando';if(acc!==null&&acc<65)reasons.push(`acerto recente ${acc}%`);if(errs>=2)reasons.push(`${errs} erros recentes`);if(overdue)reasons.push('revisão vencida')}
else if(q>=12&&acc!==null&&acc>=85&&errs===0&&!overdue){suggested='dominado';reasons.push(`${acc}% em ${q} questões`);reasons.push('sem erros recentes')}
else if(q>=6&&acc!==null&&acc>=70){suggested='revisando';reasons.push(`${acc}% em ${q} questões`);if(overdue)reasons.push('revisão vencida')}
else if(p.status==='nao_iniciado'&&(q>0||state.sessions.some(s=>s.topicId===topic.id))){suggested='estudando';reasons.push('já há atividade registrada')}
else if(p.status==='estudando'&&q>=8&&acc!==null&&acc<55){suggested='estudando';reasons.push(`acerto ainda baixo: ${acc}%`)}
if(!reasons.length){if(q===0)reasons.push('ainda sem base suficiente de questões');else if(acc!==null)reasons.push(`${acc}% de acertos registrados`);if(overdue)reasons.push('revisão pendente')}
return {current:p.status,suggested,diff:suggested!==p.status,reasons:reasons.slice(0,3),acc,q,errs,overdue}}
function smartStatusSummary(){const suggestions=topics.map(t=>({topic:t,...masterySuggestion(t)})).filter(x=>x.diff);const down=suggestions.filter(x=>x.current==='dominado'&&x.suggested!=='dominado').length,up=suggestions.filter(x=>x.suggested==='dominado').length;return {suggestions,down,up}}

function ensureReview(topicId){let r=state.reviews.find(x=>x.topicId===topicId);if(!r){state.reviews.push({id:uid(),topicId,due:addDays(today(),1),interval:1,ease:2.3,count:0,lastRating:null,lastReviewed:null})}}
function addDays(s,n){const d=dateOnly(s);d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dueReviews(){return state.reviews.filter(r=>r.due<=today()).sort((a,b)=>a.due.localeCompare(b.due))}
function accuracyForTopic(id){const qs=state.questionSessions.filter(q=>q.topicId===id);if(!qs.length)return null;const tot=qs.reduce((a,b)=>a+b.total,0),cor=qs.reduce((a,b)=>a+b.correct,0);return tot?Math.round(cor/tot*100):null}
function questionCountTopic(id){return state.questionSessions.filter(q=>q.topicId===id).reduce((a,b)=>a+b.total,0)}
function recentErrorCount(id,days=30){const cutoff=addDays(today(),-days);return state.errors.filter(e=>e.topicId===id&&e.date>=cutoff&&!e.resolved).length}
function priority(topic){const p=getProgress(topic.id), acc=accuracyForTopic(topic.id), last=p.updatedAt?p.updatedAt.slice(0,10):null, stale=last?clamp(daysBetween(last,today()),0,30):30, overdue=state.reviews.some(r=>r.topicId===topic.id&&r.due<=today()), errs=recentErrorCount(topic.id);let s=0;s+=(acc===null?18:clamp((75-acc)*.9,0,45));s+=clamp(stale*.85,0,25);s+=({nao_iniciado:22,estudando:14,revisando:8,dominado:0}[p.status]||0);s+=overdue?12:0;s+=clamp(errs*4,0,16);s+=(disciplineWeights[topic.discipline]/30)*8;return Math.round(clamp(s,0,100))}
function priorityList(){return [...topics].map(t=>({...t,priority:priority(t)})).sort((a,b)=>b.priority-a.priority)}
function weightedCoverage(){let num=0,den=0;for(const [d,w] of Object.entries(disciplineWeights)){const ts=topics.filter(t=>t.discipline===d),avg=ts.reduce((a,t)=>a+statusInfo[getProgress(t.id).status][1],0)/ts.length;num+=avg*w;den+=w}return Math.round(num/den)}
function accuracyOverall(){const tot=state.questionSessions.reduce((a,b)=>a+b.total,0),cor=state.questionSessions.reduce((a,b)=>a+b.correct,0);return tot?Math.round(cor/tot*100):0}
function retentionScore(){const rs=state.reviews.filter(r=>r.count>0);if(!rs.length)return 50;const good=rs.filter(r=>['bom','facil'].includes(r.lastRating)).length;return Math.round(good/rs.length*100)}
function latestSim(){return [...state.simulations].sort((a,b)=>b.date.localeCompare(a.date))[0]}
function readiness(){const cov=weightedCoverage(),acc=state.questionSessions.length?accuracyOverall():40,ret=retentionScore(),sim=latestSim()?latestSim().percent:50,disc=state.discursives.length?Math.round(state.discursives.reduce((a,b)=>a+b.score,0)/state.discursives.length*10):50,pr=state.practicals.length?Math.round(state.practicals.reduce((a,b)=>a+(b.plan+b.defense),0)/state.practicals.length*10):50;return Math.round(.25*cov+.35*acc+.15*ret+.15*sim+.05*disc+.05*pr)}
function daysToExam(){return Math.max(0,daysBetween(today(),EXAM_DATE))}
function weekStart(offset=0){const d=new Date();d.setHours(12,0,0,0);const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day+offset*7);return d}
function dateStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function weekStats(offset=0){const a=dateStr(weekStart(offset)),b=dateStr(new Date(weekStart(offset).getTime()+7*86400000));const ss=state.sessions.filter(s=>s.date>=a&&s.date<b),qs=state.questionSessions.filter(q=>q.date>=a&&q.date<b),time=ss.reduce((x,y)=>x+y.durationSeconds,0),total=qs.reduce((x,y)=>x+y.total,0),correct=qs.reduce((x,y)=>x+y.correct,0),revs=state.reviews.filter(r=>r.lastReviewed&&r.lastReviewed.slice(0,10)>=a&&r.lastReviewed.slice(0,10)<b).length;return {a,b,time,total,correct,acc:total?Math.round(correct/total*100):0,revs,sessions:ss.length}}
function streak(){const dates=[...new Set(state.sessions.map(s=>s.date))].sort().reverse();let c=0,d=today();for(;;){if(dates.includes(d)){c++;d=addDays(d,-1)}else if(c===0){d=addDays(d,-1);if(dates.includes(d)){c++;d=addDays(d,-1)}else break}else break}return c}
function todayPlan(){const top=priorityList(),due=dueReviews(),final=daysToExam()<=10;let tasks=[];if(due.length)tasks.push({id:'review-'+today(),icon:'🔁',title:'Fila de revisões',detail:due.length+' revisão(ões) vencendo hoje',minutes:final?30:20,view:'revisao'});const p1=top[0];if(p1)tasks.push({id:'priority-'+p1.id+'-'+today(),icon:'🔴',title:p1.title,detail:'Prioridade '+p1.priority+' • '+p1.discipline+' • micro-unidade de ≈ '+p1.minutes+' min',minutes:final?Math.min(30,p1.minutes):p1.minutes,view:'timer',topicId:p1.id,type:final?'Revisão':'Teoria'});const weakPhysics=top.find(t=>t.discipline==='Física');if(weakPhysics)tasks.push({id:'fgv-'+weakPhysics.id+'-'+today(),icon:'🎯',title:'Questões FGV — '+weakPhysics.title,detail:'Treino orientado ao ponto fraco em Física',minutes:Math.max(15,Math.min(30,weakPhysics.minutes)),view:'questoes',topicId:weakPhysics.id,type:'Questões'});const maint=top.slice().reverse().find(t=>getProgress(t.id).status==='dominado')||top.find(t=>t.priority<55);if(maint)tasks.push({id:'maint-'+maint.id+'-'+today(),icon:'🟢',title:'Manutenção — '+maint.title,detail:'Revisão curta da micro-unidade',minutes:Math.min(15,maint.minutes),view:'timer',topicId:maint.id,type:'Revisão'});return tasks.slice(0,4)}
function weekPlanStart(){return dateStr(weekStart(0))}
function generateWeekPlan(){const start=weekPlanStart(),prio=priorityList().slice(0,35),used=new Set(),dailyGoal=Math.max(30,+state.settings.dailyMinutesGoal||120),days=[];for(let i=0;i<7;i++){const date=addDays(start,i),tasks=[],due=state.reviews.filter(r=>r.due&&r.due<=date).slice(0,3);if(due.length)tasks.push({id:uid(),type:'review',title:'Revisões espaçadas',detail:`${due.length} revisão(ões) prioritária(s)`,minutes:Math.min(25,10+due.length*5),done:false});let topic=prio.find(t=>!used.has(t.id));if(!topic)topic=prio[i%Math.max(1,prio.length)];if(topic){used.add(topic.id);tasks.push({id:uid(),type:'study',topicId:topic.id,title:topic.title,detail:`${topic.discipline} • ${topic.group}`,minutes:Math.min(topic.minutes||20,30),done:false});if(i%2===1||i===5)tasks.push({id:uid(),type:'questions',topicId:topic.id,title:'Questões FGV',detail:`Treino guiado • ${topic.title}`,minutes:Math.min(30,Math.max(15,Math.round(dailyGoal*.22))),done:false})}if(i===6&&tasks.length>2)tasks.splice(1,1);days.push({date,tasks})}state.weekPlan={id:uid(),startDate:start,generatedAt:new Date().toISOString(),days};save();render();toast('Plano semanal criado com base nas suas prioridades atuais.')}
function weekPlanCurrent(){return state.weekPlan&&state.weekPlan.startDate===weekPlanStart()?state.weekPlan:null}
function weekPlanHtml(){const plan=weekPlanCurrent();if(!plan)return `<article class="panel auto-plan"><div class="auto-plan-head"><div><span class="eyebrow">PLANEJAMENTO AUTOMÁTICO</span><h3>Monte sua semana com base no que realmente precisa de atenção</h3><p class="help">O aplicativo combina prioridades, revisões, desempenho e sua meta diária para sugerir uma semana inicial. Você continua no controle.</p></div><button class="btn primary" id="generateWeekPlanBtn">Gerar minha semana</button></div></article>`;const total=plan.days.reduce((a,d)=>a+d.tasks.length,0),done=plan.days.reduce((a,d)=>a+d.tasks.filter(t=>t.done).length,0),mins=plan.days.reduce((a,d)=>a+d.tasks.reduce((x,t)=>x+t.minutes,0),0);return `<article class="panel auto-plan"><div class="auto-plan-head"><div><span class="eyebrow">PLANO AUTOMÁTICO DA SEMANA</span><h3>${done}/${total} tarefas concluídas</h3><div class="auto-plan-summary"><span>≈ ${mins} min planejados</span><span>${fmtDate(plan.startDate)} – ${fmtDate(addDays(plan.startDate,6))}</span><span>Atualizado ${new Date(plan.generatedAt).toLocaleString('pt-BR')}</span></div></div><button class="btn ghost" id="generateWeekPlanBtn">Recalcular plano</button></div><div class="week-plan-grid">${plan.days.map(d=>`<section class="week-day ${d.date===today()?'today':''}"><div class="week-day-head"><strong>${new Date(d.date+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','')}</strong><small>${fmtDate(d.date)}</small></div>${d.tasks.map(t=>`<div class="week-task ${t.done?'done':''}"><b>${esc(t.title)}</b><small>${esc(t.detail)} • ${t.minutes} min</small><div class="week-task-actions"><button class="btn ghost small" data-week-start="${t.id}">Abrir</button><button class="week-check ${t.done?'done':''}" data-week-done="${t.id}">${t.done?'✓':'○'}</button></div></div>`).join('')||'<small>Dia leve / recuperação.</small>'}</section>`).join('')}</div></article>`}
function findWeekTask(id){const p=weekPlanCurrent();if(!p)return null;for(const d of p.days){const t=d.tasks.find(x=>x.id===id);if(t)return t}return null}

?`${due.length} pendente${due.length>1?'s':''}`:'Fila em dia'}</h3><p>${due.length?'Revisar antes de acumular costuma ter maior retorno do que abrir conteúdo novo.':'Nenhuma revisão vencida neste momento.'}</p><button class="btn ${due.length?'warning':'ghost'} full" data-view="revisao">${due.length?'Revisar agora':'Ver revisões'}</button></article></div><details class="today-details"><summary><div><strong>Plano e indicadores de hoje</strong><small>${done}/${plan.length} tarefas concluídas • ${wk.total} questões nesta semana • ${fmtDuration(wk.time)} de estudo</small></div><span class="pill">${r}% prontidão</span></summary><div class="today-details-body"><section class="hero-dashboard"><div><span class="eyebrow">PLANO DE HOJE • ${fmtDate(today())}</span><h2>${done===plan.length&&plan.length?'Plano concluído. Preserve energia e faça uma revisão leve.':'Poucos passos, em ordem de prioridade.'}</h2><p>Escolha quanto tempo você tem agora ou execute o plano abaixo.</p><div class="time-choice">${[10,15,20,30,50].map(m=>`<button data-time-now="${m}">${m} min</button>`).join('')}</div><div class="time-suggestion" id="timeSuggestion">Escolha um tempo para receber uma tarefa que caiba agora.</div></div><div class="readiness-ring" style="--p:${r}"><div><strong>${r}%</strong><small>prontidão</small></div></div></section><div class="quick-grid"><article class="mini-card"><small>Estudo na semana</small><strong>${fmtDuration(wk.time)}</strong><p>Meta: ${state.settings.weeklyHoursGoal} h</p></article><article class="mini-card"><small>Questões na semana</small><strong>${wk.total}</strong><p>Meta: ${state.settings.weeklyQuestionsGoal}</p></article><article class="mini-card"><small>Retenção</small><strong>${retentionScore()}%</strong><p>Baseada nas revisões</p></article><article class="mini-card"><small>Revisões pendentes</small><strong>${due.length}</strong><p>Resolva antes de acumular</p></article></div><div class="today-grid"><article class="panel"><div class="panel-head"><div><span function priorityWhy(t){const bits=[],acc=accuracyForTopic(t.id),p=getProgress(t.id);if(acc!==null&&acc<70)bits.push('acerto '+acc+'%');if(!p.updatedAt)bits.push('ainda não iniciado');else{const d=daysBetween(p.updatedAt.slice(0,10),today());if(d>7)bits.push(d+' dias sem estudo')}if(state.reviews.some(r=>r.topicId===t.id&&r.due<=today()))bits.push('revisão vencida');const e=recentErrorCount(t.id);if(e)bits.push(e+' erro(s) recente(s)');return bits.slice(0,3).join(' • ')||'manutenção estratégica'}

function smartInsights(){const items=[],wk=weekStats(0),prev=weekStats(-1),top=priorityList()[0],due=dueReviews(),groups=groupStats().filter(g=>g.acc!==null||g.cov>0).sort((a,b)=>a.score-b.score),evo=diagnosticEvolutionData();if(wk.total||prev.total){const diff=wk.acc-prev.acc;if(wk.total)items.push({icon:'chart',title:'Seu desempenho nesta semana',text:`Você respondeu ${wk.total} questão(ões) com ${wk.acc}% de acertos.${prev.total?` Em relação à semana anterior, a variação foi de ${diff>=0?'+':''}${diff} p.p.`:''}`})}if(top)items.push({icon:'target',title:'Maior prioridade agora',text:`${top.title} está no topo da fila (prioridade ${top.priority}). ${priorityWhy(top)}.`});if(due.length)items.push({icon:'refresh',title:'Revisões pedindo atenção',text:`Há ${due.length} revisão(ões) pendente(s). Resolver essa fila antes de abrir muitos conteúdos novos ajuda a proteger o que já foi estudado.`});if(groups[0])items.push({icon:'alertbook',title:'Gargalo de conteúdo',text:`${groups[0].group} está entre os grupos com menor domínio atual (${groups[0].score}%). Vale concentrar teoria curta + questões nesse bloco.`});if(evo.length>1){const d=evo[evo.length-1].total.pct-evo[0].total.pct;items.push({icon:'barsleaf',title:'Evolução desde o diagnóstico inicial',text:`Seu diagnóstico saiu de ${evo[0].total.pct}% para ${evo[evo.length-1].total.pct}% (${d>=0?'+':''}${d} p.p.). Use a tendência como referência, não como nota oficial.`})}return items.slice(0,4)}

function achievementData(){const totalQ=state.questionSessions.reduce((a,b)=>a+b.total,0),timeHours=Math.round(state.sessions.reduce((a,b)=>a+b.durationSeconds,0)/3600*10)/10,dominated=topics.filter(t=>getProgress(t.id).status==='dominado').length,studying=topics.filter(t=>['estudando','revisando'].includes(getProgress(t.id).status)).length,reviewDone=state.reviews.filter(r=>r.lastReviewed).length,diag=diagnosticEvolutionData(),diagGain=diag.length>1?diag[diag.length-1].total.pct-diag[0].total.pct:0,physAcc=disciplineAccuracy('Física'),fgv=state.questionSessions.filter(q=>q.bank?.toUpperCase()==='FGV'),fgvTot=fgv.reduce((a,b)=>a+b.total,0),fgvCor=fgv.reduce((a,b)=>a+b.correct,0),fgvAcc=fgvTot?Math.round(fgvCor/fgvTot*100):0,simBest=Math.max(0,...state.simulations.map(s=>s.percent||0)),cov=weightedCoverage();const list=[{id:'q10',icon:'🎯',title:'Primeiros 10',desc:'Resolver 10 questões',current:totalQ,target:10},{id:'q100',icon:'🏅',title:'Primeiros 100',desc:'Resolver 100 questões',current:totalQ,target:100},{id:'tempo5',icon:'⏱️',title:'Ritmo inicial',desc:'Acumular 5 horas de estudo',current:timeHours,target:5,suffix:' h'},{id:'tempo20',icon:'🕒',title:'Carga de estudo',desc:'Acumular 20 horas de estudo',current:timeHours,target:20,suffix:' h'},{id:'streak3',icon:'🔥',title:'Constância 3 dias',desc:'Estudar por 3 dias seguidos',current:streak(),target:3,suffix:' dias'},{id:'streak10',icon:'⚡',title:'Constância 10 dias',desc:'Estudar por 10 dias seguidos',current:streak(),target:10,suffix:' dias'},{id:'dom1',icon:'📘',title:'Primeiro domínio',desc:'Dominar o primeiro conteúdo',current:dominated,target:1},{id:'dom10',icon:'📚',title:'Mapa avançando',desc:'Dominar 10 conteúdos',current:dominated,target:10},{id:'em_andamento',icon:'🧭',title:'Motor ligado',desc:'Ter 5 conteúdos em andamento',current:studying,target:5},{id:'review20',icon:'🔁',title:'Revisor ativo',desc:'Concluir 20 revisões',current:reviewDone,target:20},{id:'fisica80',icon:'⚛️',title:'Física em alta',desc:'Atingir 80% em 50+ questões de Física',current:physAcc,target:80,extra:questionCountDiscipline('Física')>=50},{id:'fgv80',icon:'🏛️',title:'FGV 80',desc:'Atingir 80% em 100 questões FGV',current:fgvAcc,target:80,extra:fgvTot>=100},{id:'magneto',icon:'🧲',title:'Magneto',desc:'Resolver 100 questões de Eletromagnetismo',current:questionCountGroup('Eletricidade e Magnetismo'),target:100},{id:'edital50',icon:'🗂️',title:'Edital 50',desc:'Alcançar 50% de cobertura ponderada',current:cov,target:50,suffix:'%'},{id:'sim70',icon:'📝',title:'Simulado consistente',desc:'Alcançar 70% no melhor simulado',current:simBest,target:70,suffix:'%'},{id:'diag10',icon:'🚀',title:'Evolução visível',desc:'Melhorar 10 p.p. no diagnóstico',current:diagGain,target:10,suffix:' p.p.'}];return list.map(a=>{const raw=typeof a.current==='number'?a.current:0;const done=raw>=a.target&&(a.extra===undefined||a.extra);return {...a,done,pct:Math.max(0,Math.min(100,Math.round(raw/a.target*100))),currentLabel:`${raw}${a.suffix||''}`,targetLabel:`${a.target}${a.suffix||''}`}})}

function weeklyEvolutionChartHtml(){const data=weeklySeries(8),maxTime=Math.max(1,...data.map(d=>d.time)),w=540,h=230,pad=20,base=h-28,plotW=w-pad*2,step=plotW/data.length,barW=Math.max(18,step*.5);const linePoints=data.map((d,i)=>[pad+step*i+step/2,base-(d.acc/100)*(h-60)]),bars=data.map((d,i)=>{const bh=(d.time/maxTime)*(h-70),x=pad+step*i+step/2-barW/2,y=base-bh;return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${bh.toFixed(1)}" rx="8" fill="#d8edf3"></rect>`}).join(''),circles=linePoints.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="#1489a4"></circle>`).join(''),labels=data.map((d,i)=>`<text x="${(pad+step*i+step/2).toFixed(1)}" y="${h-8}" text-anchor="middle" fill="#708192" font-size="10">${d.label}</text>`).join('');return `<div class="chart-panel"><span class="eyebrow">GRÁFICO DE EVOLUÇÃO</span><h3>Últimas 8 semanas</h3><p>Barras: horas estudadas • linha: taxa de acertos registrada.</p><div class="chart-box"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Evolução semanal"><line x1="${pad}" y1="${base}" x2="${w-pad}" y2="${base}" stroke="#d9e6ea" stroke-width="1.2"></line>${bars}<path d="${polylinePath(linePoints)}" fill="none" stroke="#1489a4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path>${circles}${labels}</svg><div class="chart-legend"><span><i style="background:#d8edf3"></i> Horas por semana</span><span><i style="background:#1489a4"></i> Acertos (%)</span></div></div><div class="week-pill-row">${data.map(d=>`<span>${d.label}: ${d.time}h • ${d.acc}% • ${d.total} q.</span>`).join('')}</div></div>`}
function disciplinePerformanceData(){const arr=[];Object.keys(disciplineWeights).forEach(d=>{const ts=topics.filter(t=>t.discipline===d);if(!ts.length)return;const score=Math.round(ts.reduce((a,t)=>a+topicVisualProgress(t.id),0)/ts.length),done=ts.filter(t=>getProgress(t.id).status==='dominado').length;arr.push({discipline:d,score,done,total:ts.length})});return arr.sort((a,b)=>b.score-a.score)}
function disciplineBarsChartHtml(){const data=disciplinePerformanceData();return `<div class="chart-panel"><span class="eyebrow">PROGRESSO POR ÁREA</span><h3>Onde você está mais forte e mais fraco</h3><p>Uma visão rápida para redistribuir tempo e questões.</p><div class="discipline-bars">${data.map(d=>`<div class="discipline-bar-row"><div><strong>${d.discipline}</strong><div class="mini-muted">${d.done}/${d.total} dominados</div></div><div class="discipline-bar"><span style="width:${d.score}%"></span></div><b>${d.score}%</b></div>`).join('')}</div></div>`}
function statusDistributionChartHtml(){const c=contentStatusCounts(),total=Math.max(1,c.todos),p0=Math.round(c.nao_iniciado/total*100),p1=Math.round(c.estudando/total*100),p2=Math.round(c.revisando/total*100),p3=Math.round(c.dominado/total*100);const donut=`conic-gradient(#d5dee5 0 ${p0}%, #ebb95d ${p0}% ${p0+p1}%, #74aee0 ${p0+p1}% ${p0+p1+p2}%, #20a178 ${p0+p1+p2}% 100%)`;return `<div class="chart-panel"><span class="eyebrow">DISTRIBUIÇÃO DOS STATUS</span><h3>Como o mapa de conteúdos está se transformando</h3><div class="status-donut-wrap"><div class="status-donut" style="background:${donut}"><div class="status-donut-center"><strong>${c.dominado}</strong><span>dominados</span></div></div><div class="status-legend"><div class="legend-row"><i style="background:#d5dee5"></i><span>Não iniciados</span><b>${c.nao_iniciado}</b></div><div class="legend-row"><i style="background:#ebb95d"></i><span>Estudando</span><b>${c.estudando}</b></div><div class="legend-row"><i style="background:#74aee0"></i><span>Revisando</span><b>${c.revisando}</b></div><div class="legend-row"><i style="background:#20a178"></i><span>Dominados</span><b>${c.dominado}</b></div></div></div><div class="chart-note">Quando os cartões dominados começarem a crescer e os não iniciados a diminuir, o seu mapa estará visualmente mais saudável.</div></div>`}
function questionVolumeChartHtml(){const data=weeklySeries(8),maxQ=Math.max(1,...data.map(d=>d.total)),w=540,h=210,pad=18,base=h-24,plotW=w-pad*2,step=plotW/data.length,barW=Math.max(16,step*.45);const bars=data.map((d,i)=>{const bh=(d.total/maxQ)*(h-65),x=pad+step*i+step/2-barW/2,y=base-bh;return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${bh.toFixed(1)}" rx="8" fill="#84d4c5"></rect><text x="${(x+barW/2).toFixed(1)}" y="${(y-6).toFixed(1)}" text-anchor="middle" fill="#5f7082" font-size="10">${d.total}</text>`}).join('');const labels=data.map((d,i)=>`<text x="${(pad+step*i+step/2).toFixed(1)}" y="${h-8}" text-anchor="middle" fill="#708192" font-size="10">${d.label}</text>`).join('');return `<div class="chart-panel"><span class="eyebrow">QUESTÕES POR SEMANA</span><h3>Volume de treino recente</h3><p>Use para perceber constância e queda de ritmo.</p><div class="chart-box"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Questões por semana"><line x1="${pad}" y1="${base}" x2="${w-pad}" y2="${base}" stroke="#d9e6ea" stroke-width="1.2"></line>${bars}${labels}</svg></div></div>`}

butionChartHtml()}<div class="chart-panel"><span class="eyebrow">AÇÕES DE MAIOR RETORNO</span><h3>Priorize estes próximos passos</h3>${prior.slice(0,4).map((t,i)=>`<div class="priority-item"><div class="score-badge ${scoreClass(t.priority)}">${i+1}</div><div><strong>${t.title}</strong><small>${priorityWhy(t)}</small></div></div>`).join('')}<div class="muted-box">Prontidão combina cobertura do edital, acertos, retenção, simulado, discursiva e prova prática. É um indicador de estudo, não uma previsão oficial de classificação.</div>${achievementSummaryHtml()}</div></div><div class="two-col"><article class="panel"><div class="panel-head"><div><span class="eyebrow">TEMPO</span><h3>Distribuição das horas</h3></div></div>${timeDistribution()}</article><aside class="panel"><span class="eyebrow">DÍVIDA DE REVISÃO</span><h3>${dueReviews().length} revisões pendentes</h3>${debtHtml()}</aside></div><article class="panel" style="margin-top:16px"><div class="panel-head"><div><span class="eyebrow">CONQUISTAS</span><h3>Seus marcos de preparação</h3></div><button class="btn ghost small" data-view="relatorios">Ver painel completo</button></div>${achievementsHtml(6)}</article>`,'Dashboard')}

function contentsView(){const ds=[...new Set(topics.map(t=>t.discipline))],done=topics.filter(t=>getProgress(t.id).status==='dominado').length;return shell(`${pageTitle('MAPA DE ESTUDOS','Edital e fundamentos','Navegue primeiro pelo conteúdo oficial. Os fundamentos recomendados ficam separados para não serem confundidos com itens nominais do edital.')}<div class="content-mode-switch"><button class="${contentAreaMode==='edital'?'active':''}" data-content-mode="edital">${uiIcon('clipboard',14)} Conteúdo oficial do edital</button><button class="${contentAreaMode==='fundamentos'?'active':''}" data-content-mode="fundamentos">${uiIcon('book',14)} Fundamentos recomendados</button></div>${contentAreaMode==='fundamentos'?foundationMapHtml():`<div class="syllabus-note"><span style="font-size:22px">⌁</span><div><b>Conteúdo oficial + micro-unidades</b><p>O item oficial preserva o texto-base do edital. As micro-unidades são apenas uma divisão didática para organizar o estudo; não representam novos tópicos oficiais.</p></div></div><div class="quick-session"><strong>Quanto tempo você tem agora?</strong><div class="quick-buttons"><button data-quick-min="15">Só 15 min</button><button data-quick-min="20">20 min</button><button data-quick-min="30">30 min</button><button data-quick-min="999">Sem limite</button></div></div>${contentOverviewCardsHtml()}<div class="content-kpis"><span class="pill">${topics.length} micro-unidades</span><span class="pill">${done} dominadas</span><span class="pill">${topics.filter(t=>t.discipline==='Física').length} de Física</span></div><div class="content-toolbar"><div class="toolbar-note">Use os cartões acima para filtrar rapidamente o que já domina, o que está em andamento e o que ainda não iniciou.</div><div class="tabs-scroll"><div class="tabline" id="contentFilters"><button class="${contentDisciplineFilter==='Todos'?'active':''}" data-dfilter="Todos">Todos</button>${ds.map(d=>`<button class="${contentDisciplineFilter===d?'active':''}" data-dfilter="${
