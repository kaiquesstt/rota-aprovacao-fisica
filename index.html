function foundationMapHtml(){return `<div class="foundation-intro"><div class="foundation-icon">${uiIcon('book',22)}</div><div><span class="eyebrow">BASE PARA O EDITAL</span><h3>Fundamentos recomendados</h3><p>Estes conteúdos ajudam a resolver os tópicos oficiais, mas ficam separados porque não aparecem necessariamente como itens nominais do edital. Use-os quando perceber uma lacuna de base.</p></div></div><div class="foundation-grid"><article class="foundation-card"><span class="foundation-tag">Mecânica • pré-requisito</span><h3>Cinemática essencial</h3><ul><li>Referencial, posição, deslocamento e trajetória</li><li>Velocidade média e instantânea</li><li>Aceleração</li><li>MRU e MRUV</li><li>Gráficos s×t, v×t e a×t</li><li>Queda livre e movimento vertical</li><li>Movimento circular básico</li></ul><div class="note">Útil como base para dinâmica, energia, gravitação e interpretação de movimentos.</div></article><article class="foundation-card"><span class="foundation-tag">Ferramenta matemática</span><h3>Vetores e decomposição</h3><ul><li>Módulo, direção e sentido</li><li>Soma e subtração vetorial</li><li>Componentes em eixos cartesianos</li><li>Trigonometria básica aplicada</li><li>Leitura de diagramas de forças</li></ul><div class="note">Recomendado antes de aprofundar dinâmica, campos e força magnética.</div></article><article class="foundation-card"><span class="foundation-tag">Leitura quantitativa</span><h3>Gráficos, proporções e unidades</h3><ul><li>Razão e proporcionalidade</li><li>Notação científica</li><li>Conversão de unidades</li><li>Inclinação e área em gráficos</li><li>Ordem de grandeza</li></ul><div class="note">Base transversal para praticamente todos os blocos de Física.</div></article></div>`}
function topicListHtml(filter,maxMinutes=999){const visible=topics.filter(t=>(filter==='Todos'||t.discipline===filter)&&t.minutes<=maxMinutes);if(!visible.length)return '<div class="empty"><p>Nenhuma micro-unidade corresponde a esses filtros.</p></div>';return [...new Set(visible.map(t=>t.discipline+'||'+t.group))].map((k,gi)=>{const [d,g]=k.split('||'),ts=visible.filter(t=>t.discipline===d&&t.group===g),allGroup=topics.filter(t=>t.discipline===d&&t.group===g),dom=allGroup.filter(t=>getProgress(t.id).status==='dominado').length,gpct=allGroup.length?Math.round(dom/allGroup.length*100):0,officials=[...new Set(ts.map(t=>t.officialItem))],openGroup=(filter!=='Todos'||maxMinutes<999||gi===0)?'open':'';return `<details class="syllabus-group" ${openGroup}><summary><div><div class="group-title-row"><span class="group-kicker">${esc(d)}</span><h3>${esc(g)}</h3><span class="pill">${ts.length} visíveis</span></div><div class="group-progress-row"><div class="official-progress"><span style="width:${gpct}%"></span></div><small>${dom}/${allGroup.length} micro-unidades dominadas</small></div></div><div class="group-percent"><b>${gpct}%</b><small>grupo</small></div></summary><div class="group-body">${officials.map(o=>{const os=ts.filter(t=>t.officialItem===o),allOfficial=topics.filter(t=>t.discipline===d&&t.group===g&&t.officialItem===o),od=allOfficial.filter(t=>getProgress(t.id).status==='dominado').length,pct=allOfficial.length?Math.round(od/allOfficial.length*100):0;return `<details class="syllabus-block" ${filter!=='Todos'||maxMinutes<999?'open':''}><summary><div><span class="official-label">ITEM OFICIAL DO EDITAL</span><strong>${esc(o)}</strong><div class="official-summary-meta"><span class="official-count">${od}/${allOfficial.length} concluídas • ${os.length} exibidas</span><span class="pill">${pct}%</span></div><div class="official-progress" aria-label="${pct}% concluído"><span style="width:${pct}%"></span></div></div></summary><div class="topic-list">${os.map((t,i)=>{const p=getProgress(t.id),acc=accuracyForTopic(t.id),pr=priority(t),prClass=pr>=75?'high':pr>=50?'medium':'low',prLabel=pr>=75?'Alta':pr>=50?'Média':'Baixa',statusClass='status-'+p.status,sug=masterySuggestion(t);return `<div class="subtopic-card ${statusClass}"><div class="subtopic-index">${String(i+1).padStart(2,'0')}</div><div class="subtopic-content"><div class="subtopic-title-row"><strong>${esc(t.title)}</strong><span class="priority-chip ${prClass}">Prioridade ${prLabel} · ${pr}</span>${sug.diff?`<span class="mastery-suggestion ${sug.current==='dominado'?'warn':sug.suggested==='dominado'?'good':''}">Sugestão: ${statusName(sug.suggested)}</span>`:''}</div><div class="subtopic-meta"><span class="subtopic-chip time">${svgIcon('clock',12)} ≈ ${t.minutes} min</span><span class="subtopic-chip">${t.part}</span><span class="subtopic-chip history">${svgIcon('chart',12)} ${acc===null?'Sem questões registradas':acc+'% de acertos'}</span></div>${sug.diff?`<div class="smart-status-box"><b>Status inteligente:</b> ${sug.reasons.map(esc).join(' • ')}</div>`:''}</div><div class="subtopic-side"><div class="status-field"><label>Situação</label><select class="subtopic-select" data-topic-status="${t.id}" aria-label="Situação de ${esc(t.title)}"><option value="nao_iniciado" ${p.status==='nao_iniciado'?'selected':''}>○ Não iniciado</option><option value="estudando" ${p.status==='estudando'?'selected':''}>◔ Estudando</option><option value="revisando" ${p.status==='revisando'?'selected':''}>↻ Revisando</option><option value="dominado" ${p.status==='dominado'?'selected':''}>✓ Dominado</option></select></div><div class="subtopic-actions"><button class="pin-btn ${(state.pinnedTopics||[]).includes(t.id)?'pinned':''}" data-pin-topic="${t.id}" title="${(state.pinnedTopics||[]).includes(t.id)?'Remover do foco da semana':'Fixar no foco da semana'}">${(state.pinnedTopics||[]).includes(t.id)?'📌':'☆'}</button>${sug.diff?`<button class="apply-suggestion" data-apply-suggest="${t.id}" data-suggest-status="${sug.suggested}">Aplicar ${statusName(sug.suggested)}</button>`:''}<button class="study-subtopic" data-topic-focus="${t.id}">Estudar agora →</button></div></div></div>`}).join('')}</div></details>`}).join('')}</div></details>`}).join('')}
function reviewView(){const due=dueReviews(),cards=state.flashcards.filter(c=>(c.due||today())<=today());return shell(`${pageTitle('REPETIÇÃO ESPAÇADA','Fila de revisões','Avalie a lembrança para recalcular o próximo intervalo.')}<div class="two-col"><article class="panel"><div class="panel-head"><div><span class="eyebrow">HOJE</span><h3>${due.length} conteúdos para revisar</h3></div><button class="btn primary small" id="startReviews" ${due.length?'':'disabled'}>Começar fila</button></div>${due.length?due.map(r=>{const t=topics.find(x=>x.id===r.topicId);return `<div class="review-item"><div><strong>${t?.title||'Conteúdo'}</strong><small>Venceu ${fmtDate(r.due)} • intervalo ${r.interval} dia(s) • ${r.count} revisões</small></div><button class="btn ghost small" data-review-one="${r.id}">Revisar</button></div>`}).join(''):'<div class="empty"><span>✓</span><p>Sem revisões pendentes hoje.</p></div>'}</article><aside class="panel"><span class="eyebrow">DÍVIDA</span><h3>Controle de atraso</h3>${debtHtml()}<hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><span class="eyebrow">FLASHCARDS</span><h3>${cards.length} cartões vencendo</h3><button class="btn ghost full" data-view="flashcards">Abrir flashcards</button></aside></div>${reviewMode?reviewModalHtml():''}`,'Revisões')}
function reviewModalHtml(){const r=state.reviews.find(x=>x.id===reviewMode),t=r&&topics.find(x=>x.id===r.topicId);if(!r||!t)return '';return `<article class="panel" style="margin-top:16px"><div class="flashcard-stage"><div class="flashcard"><span class="eyebrow">RECUPERAÇÃO ATIVA</span><h3>${t.title}</h3><p>Sem consultar material, explique o conceito, as relações fundamentais e um exemplo de aplicação.</p><div class="muted-box">Depois de tentar recuperar da memória, escolha como foi sua lembrança.</div></div></div><div class="rating-row"><button data-review-rate="errei">😵 Errei</button><button data-review-rate="dificil">😕 Difícil</button><button data-review-rate="bom">🙂 Bom</button><button data-review-rate="facil">😎 Fácil</button></div></article>`}
function rateReview(rating){const r=state.reviews.find(x=>x.id===reviewMode);if(!r)return;const map={errei:1,dificil:2,bom:3,facil:4},v=map[rating];r.count++;r.lastRating=rating;r.lastReviewed=new Date().toISOString();if(v===1)r.interval=1;else if(v===2)r.interval=Math.max(2,Math.round(r.interval*1.4));else if(v===3)r.interval=Math.max(3,Math.round(r.interval*2.1));else r.interval=Math.max(7,Math.round(r.interval*3));r.interval=Math.min(60,r.interval);r.due=addDays(today(),r.interval);reviewMode=null;save();toast('Revisão registrada. Próxima em '+r.interval+' dia(s).');render()}
function flashcardsView(){const due=state.flashcards.filter(c=>(c.due||today())<=today()),card=due[0];return shell(`${pageTitle('FLASHCARDS','Recuperação ativa integrada','Crie cartões ligados diretamente ao conteúdo do edital.','<button class="btn primary" id="newCard">+ Novo cartão</button>')}<div class="two-col"><article class="panel"><div class="panel-head"><div><span class="eyebrow">FILA DE HOJE</span><h3>${due.length} cartão(ões)</h3></div></div>${card?`<div class="flashcard-stage"><div class="flashcard" id="flashCard"><span class="eyebrow">${topics.find(t=>t.id===card.topicId)?.title||'Conteúdo'}</span><h3>${esc(card.front)}</h3><div id="cardAnswer" class="answer" style="display:none">${esc(card.back)}</div></div></div><div style="text-align:center"><button class="btn primary" id="showAnswer">Mostrar resposta</button></div><div class="rating-row" id="cardRatings" style="display:none;margin-top:12px"><button data-card-rate="errei">Errei</button><button data-card-rate="dificil">Difícil</button><button data-card-rate="bom">Bom</button><button data-card-rate="facil">Fácil</button></div>`:'<div class="empty"><span>◇</span><p>Sem flashcards vencendo. Crie cartões para conceitos que deseja recuperar de memória.</p></div>'}</article><aside class="panel"><span class="eyebrow">COLEÇÃO</span><h3>${state.flashcards.length} cartões</h3><div class="recent-list">${state.flashcards.slice(0,8).map(c=>`<div><span class="dot"></span><div><strong>${esc(c.front)}</strong><small>${fmtDate(c.due||today())} • ${c.lapses||0} lapsos</small></div><button class="link-btn" data-del-card="${c.id}">×</button></div>`).join('')||'<div class="empty"><p>Nenhum cartão criado.</p></div>'}</div></aside></div><div id="cardForm"></div>`,'Flashcards')}
function formulaView(){const weak=[...state.formulas].sort((a,b)=>(b.lapses||0)-(a.lapses||0));const q=microQuestions[microIndex%microQuestions.length];return shell(`${pageTitle('MICROTREINOS','Fórmulas, unidades e gráficos','Sessões curtas para fragilidades específicas de Física.')}<div class="two-col"><article class="panel"><div class="panel-head"><div><span class="eyebrow">FÓRMULAS EM RISCO</span><h3>Treino de recuperação</h3></div></div><div class="formula-grid">${weak.map(f=>`<div class="formula-card"><small>${f.title}${f.favorite?' ★':''}</small><div class="formula-code">${f.formula}</div><p class="help">${f.note}</p><div class="task-actions"><button class="choice-chip" data-formula-lapse="${f.id}">Não lembrei</button><button class="choice-chip" data-formula-ok="${f.id}">Lembrei</button><button class="choice-chip" data-formula-fav="${f.id}">${f.favorite?'★':'☆'}</button></div></div>`).join('')}</div></article><aside class="panel"><span class="eyebrow">MICROQUIZ • ${q.kind}</span><h3>${q.q}</h3><div class="micro-options">${q.opts.map((o,i)=>`<button data-micro-option="${i}">${String.fromCharCode(65+i)}) ${o}</button>`).join('')}</div><div id="microFeedback" class="help"></div><p class="help">Acertos no microtreino: ${state.micro.correct}/${state.micro.answered}</p></aside></div>`,'Fórmulas & microtreinos')}
function questionsView(){const tabs=[['register','Registrar sessão'],['bank','Banco de questões'],['fgv','Modo FGV'],['adaptive','Treino adaptativo']];return shell(`${pageTitle('QUESTÕES','Questões & FGV','Registre desempenho, armazene itens e treine pontos fracos.','<button class="btn ghost" id="exportQuestionsCsv">Exportar CSV</button>')}<div class="tabline">${tabs.map(([id,x])=>`<button data-qtab="${id}" class="${questionTab===id?'active':''}">${x}</button>`).join('')}</div>${questionTab==='register'?questionRegisterHtml():questionTab==='bank'?questionBankHtml():questionTab==='fgv'?fgvHtml():adaptiveHtml()}`,'Questões & FGV')}
function topicOptions(selected=''){return topics.map(t=>`<option value="${t.id}" ${selected===t.id?'selected':''}>${t.discipline} • ${t.group} • ${t.title}</option>`).join('')}
function questionRegisterHtml(){return `<div class="two-col"><article class="panel"><div class="form-grid-2"><div class="field"><label>Conteúdo</label><select id="qrTopic">${topicOptions(timer.topicId)}</select></div><div class="field"><label>Banca</label><input id="qrBank" value="FGV"></div><div class="field"><label>Ano</label><input id="qrYear" type="number" value="2026"></div><div class="field"><label>Data</label><input id="qrDate" type="date" value="${today()}"></div><div class="field"><label>Total de questões</label><input id="qrTotal" type="number" min="1" value="20"></div><div class="field"><label>Acertos</label><input id="qrCorrect" type="number" min="0" value="0"></div></div><div class="field" style="margin-top:12px"><label>Tipo de erro predominante</label><select id="qrReason"><option value="">Não informar</option>${errorReasons.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field" style="margin-top:12px"><label>Observação</label><textarea id="qrNotes" placeholder="O que precisa melhorar?"></textarea></div><button class="btn primary full" id="saveQuestionSession">Salvar desempenho</button></article><aside class="panel"><span class="eyebrow">PRÉVIA</span><h3 id="qrPreview">0% de acertos</h3><p class="help">Ao salvar, a prioridade do conteúdo é recalculada automaticamente.</p><div class="muted-box">Para erros importantes, use o Caderno de Erros e registre a questão individualmente.</div></aside></div>`}
function questionBankHtml(){return `<div class="two-col"><article class="panel"><span class="eyebrow">ADICIONAR QUESTÃO</span><h3>Seu banco local</h3><div class="form-grid-2"><div class="field"><label>Conteúdo</label><select id="qbTopic">${topicOptions()}</select></div><div class="field"><label>Banca</label><input id="qbBank" value="FGV"></div><div class="field"><label>Ano</label><input id="qbYear" type="number" value="2026"></div><div class="field"><label>Número/fonte</label><input id="qbRef" placeholder="Ex.: Q42 / SEDUC-MG"></div></div><div class="field" style="margin-top:10px"><label>Enunciado ou identificação</label><textarea id="qbPrompt" placeholder="Pode inserir o enunciado, um resumo ou apenas a identificação."></textarea></div><div class="field"><label>Gabarito / comentário</label><input id="qbAnswer"></div><button class="btn primary full" id="saveBankQuestion">Adicionar</button></article><aside class="panel"><span class="eyebrow">BANCO</span><h3>${state.questionBank.length} itens salvos</h3><div class="question-bank">${state.questionBank.slice(0,12).map(q=>`<div class="question-card ${q.favorite?'favorite':''}"><small>${q.bank} • ${q.year} • ${q.ref||'sem ref.'}</small><h4>${esc(q.prompt||topics.find(t=>t.id===q.topicId)?.title)}</h4><div class="tags"><span>${topics.find(t=>t.id===q.topicId)?.group||''}</span></div><button class="link-btn" data-qfav="${q.id}">${q.favorite?'★':'☆'}</button> <button class="danger-link" data-qdel="${q.id}">Excluir</button></div>`).join('')||'<div class="empty"><p>Seu banco ainda está vazio.</p></div>'}</div></aside></div>`}
function fgvHtml(){const q=state.questionSessions.filter(x=>x.bank?.toUpperCase()==='FGV'),tot=q.reduce((a,b)=>a+b.total,0),cor=q.reduce((a,b)=>a+b.correct,0),acc=tot?Math.round(cor/tot*100):0;const weak=priorityList().filter(t=>accuracyForTopic(t.id)!==null).slice(0,6);return `<div class="metric-grid"><div class="metric"><div class="metric-icon">FGV</div><div><small>Questões</small><strong>${tot}</strong></div></div><div class="metric"><div class="metric-icon">%</div><div><small>Aproveitamento</small><strong>${acc}%</strong></div></div><div class="metric"><div class="metric-icon">⚛</div><div><small>Física</small><strong>${disciplineAccuracy('Física','FGV')}%</strong></div></div><div class="metric"><div class="metric-icon">▤</div><div><small>Pedagógicos</small><strong>${disciplineAccuracy('Conhecimentos Pedagógicos','FGV')}%</strong></div></div></div><article class="panel"><span class="eyebrow">PONTOS FRACOS COM DADOS</span><h3>Onde direcionar questões FGV</h3>${weak.map(t=>`<div class="priority-item"><div class="score-badge ${scoreClass(t.priority)}">${accuracyForTopic(t.id)}%</div><div><strong>${t.title}</strong><small>${questionCountTopic(t.id)} questões registradas</small></div><button class="btn ghost small" data-topic-focus="${t.id}">Treinar</button></div>`).join('')||'<div class="empty"><p>Registre sessões de questões FGV para gerar esta análise.</p></div>'}</article>`}
function disciplineAccuracy(d,bank){const q=state.questionSessions.filter(x=>x.discipline===d&&(!bank||x.bank?.toUpperCase()===bank.toUpperCase())),tot=q.reduce((a,b)=>a+b.total,0),cor=q.reduce((a,b)=>a+b.correct,0);return tot?Math.round(cor/tot*100):0}
function adaptiveHtml(){const list=priorityList(),weak=list.slice(0,5),mid=list.slice(Math.floor(list.length*.35),Math.floor(list.length*.35)+3),strong=[...list].reverse().slice(0,2);return `<article class="panel"><span class="eyebrow">SESSÃO ADAPTATIVA</span><h3>20 questões sugeridas</h3><p class="help">50% pontos fracos • 30% intermediários • 20% manutenção.</p><div class="final-review-list"><div class="phase-card"><strong>10 questões — pontos fracos</strong><small>${weak.map(x=>x.title).join(' • ')}</small></div><div class="phase-card"><strong>6 questões — intermediários</strong><small>${mid.map(x=>x.title).join(' • ')}</small></div><div class="phase-card"><strong>4 questões — manutenção</strong><small>${strong.map(x=>x.title).join(' • ')}</small></div></div><button class="btn primary" style="margin-top:14px" data-view="timer">Iniciar cronômetro de treino</button></article>`}

function diagnosticTopic(q){const c=topics.filter(t=>t.discipline===q.discipline);if(!c.length)return null;for(const k of (q.map||[])){const kk=slug(k);const hit=c.find(t=>slug((t.title||'')+' '+(t.officialItem||'')+' '+(t.group||'')).includes(kk));if(hit)return hit}return c[0]}
function diagnosticQuestionsFor(x){const ids=x?.questionIds;if(Array.isArray(ids)&&ids.length)return ids.map(id=>diagnosticQuestions.find(q=>q.id===id)).filter(Boolean);return diagnosticQuestions}
function diagnosticPairs(attempt){const qs=diagnosticQuestionsFor(attempt);return qs.map((q,i)=>({q,i}))}
function diagStats(attempt,filterFn=()=>true){const idx=diagnosticPairs(attempt).filter(x=>filterFn(x.q));const total=idx.length,answered=idx.filter(x=>attempt.answers?.[x.i]!=null).length,correct=idx.filter(x=>attempt.answers?.[x.i]===x.q.a).length;return {total,answered,correct,pct:total?Math.round(correct/total*100):0}}
function diagBand(p){return p<40?['Base primeiro','🔴']:p<70?['Revisão prioritária','🟠']:p<85?['Consolidar + questões','🟡']:['Manutenção','🟢']}
function diagAction(p){return p<40?'Começar por conceitos e exemplos simples':p<70?'Revisar teoria e fazer questões guiadas':p<85?'Consolidar com questões e revisão espaçada':'Manter com questões periódicas'}
const quickDiagnosticIds=['d01','d03','d05','d11','d13','d18','d19','d21','d24','d27','d31','d32','d35','d40','d43','d46','d49','d52','d54','d57'];
function diagnosticEvolutionData(){return [...state.diagnostic.attempts].sort((a,b)=>(a.completedAt||'').localeCompare(b.completedAt||'')).map(a=>({attempt:a,total:diagStats(a),physics:diagStats(a,q=>q.discipline==='Física')}))}
function diagnosticEvolutionHtml(){const data=diagnosticEvolutionData();if(!data.length)return '';const first=data[0],last=data[data.length-1],delta=last.total.pct-first.total.pct,phyDelta=last.physics.pct-first.physics.pct;return `<article class="panel diag-evolution"><div class="diag-evolution-head"><div><span class="eyebrow">DIAGNÓSTICO EVOLUTIVO</span><h3>Seu marco zero comparado com o desempenho atual</h3><p class="help">Repita o diagnóstico de 20 questões periodicamente. O objetivo é observar tendência, não decorar respostas.</p></div><div><div class="evolution-kpi ${delta<0?'negative':''}">${delta>=0?'+':''}${delta} p.p.</div><small class="help">evolução geral • Física ${phyDelta>=0?'+':''}${phyDelta} p.p.</small></div></div><div class="evolution-list">${data.slice(-6).map(x=>`<div class="evolution-col"><div class="evolution-bar-wrap"><div class="evolution-bar" style="height:${Math.max(4,x.total.pct)}%"></div></div><b>${x.total.pct}%</b><small>${fmtDate(x.attempt.date)}</small></div>`).join('')}</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn primary" id="diagEvolution">Fazer diagnóstico evolutivo — 20</button><button class="btn ghost" id="diagSeeFirst">Ver primeiro diagnóstico</button></div></article>`}
function diagnosticModeLabel(mode){return mode==='full'?'completo':mode==='evolution'?'evolutivo':'rápido'}
function startDiagnostic(mode='full'){const ids=(mode==='quick'||mode==='evolution')?quickDiagnosticIds:diagnosticQuestions.map(q=>q.id);state.diagnostic.draft={id:uid(),mode,questionIds:ids,startedAt:new Date().toISOString(),index:0,answers:Array(ids.length).fill(null),confidences:Array(ids.length).fill(null)};state.diagnostic.review=false;state.diagnostic.activeResultId=null;save(true);render()}
function finishDiagnostic(){const d=state.diagnostic.draft;if(!d)return;const blank=d.answers.filter(x=>x==null).length;if(blank&& !confirm(`Há ${blank} questão(ões) sem resposta. Elas contarão como não dominadas no diagnóstico. Finalizar mesmo assim?`))return;const a={id:d.id,mode:d.mode||'full',questionIds:d.questionIds||diagnosticQuestions.map(q=>q.id),date:today(),startedAt:d.startedAt,completedAt:new Date().toISOString(),answers:d.answers,confidences:d.confidences||Array(d.answers.length).fill(null),applied:false};state.diagnostic.attempts.push(a);state.diagnostic.draft=null;state.diagnostic.activeResultId=a.id;state.diagnostic.review=false;save();render();toast('Diagnóstico concluído. Seu ponto de partida foi calculado.')}
function applyDiagnostic(id){const a=state.diagnostic.attempts.find(x=>x.id===id);if(!a||a.applied)return;diagnosticPairs(a).forEach(({q,i})=>{const t=diagnosticTopic(q);if(!t)return;const correct=a.answers?.[i]===q.a,conf=a.confidences?.[i]||null;const reason=correct?(conf==='guess'?'Diagnóstico inicial • acerto por chute':conf==='medium'?'Diagnóstico inicial • acerto com dúvida':'Diagnóstico inicial'):(conf==='sure'?'Diagnóstico inicial • errei com certeza':'Diagnóstico inicial');if(!(correct&&conf==='guess'))state.questionSessions.push({id:uid(),topicId:t.id,discipline:t.discipline,topicTitle:t.title,bank:'Diagnóstico inicial',year:2026,total:1,correct:correct?1:0,wrong:correct?0:1,accuracy:correct?100:0,reason,notes:`${q.area} • ${q.topic}${conf?' • confiança: '+conf:''}`,date:a.date,createdAt:new Date().toISOString()});if((!correct||conf==='guess'||conf==='medium')&&getProgress(t.id).status==='nao_iniciado'){state.progress=state.progress.filter(p=>p.topicId!==t.id);state.progress.push({topicId:t.id,status:conf==='medium'&&correct?'revisando':'estudando',updatedAt:null,diagnostic:true})}if(!correct&&conf==='sure'&&!state.errors.some(e=>e.diagnosticQuestionId===q.id)){state.errors.unshift({id:uid(),topicId:t.id,bank:'Diagnóstico inicial',year:2026,reason:'Confundi conceitos',physicsType:q.discipline==='Física'?'Conceito':'',tags:['diagnostico','revisar'],title:`Diagnóstico — ${q.topic}`,note:'Resposta incorreta marcada com alta confiança. Revisar o conceito, pois pode haver uma concepção equivocada.',date:a.date,favorite:false,resolved:false,diagnosticQuestionId:q.id,createdAt:new Date().toISOString()})}});a.applied=true;save();render();toast('Resultado incorporado às prioridades do plano.')}
function diagnosticView(){const d=state.diagnostic.draft;if(d)return shell(diagnosticQuestionHtml(d),'Diagnóstico inicial');const attempts=[...state.diagnostic.attempts].sort((a,b)=>(b.completedAt||'').localeCompare(a.completedAt||''));const active=attempts.find(a=>a.id===state.diagnostic.activeResultId)||attempts[0];if(!active)return shell(diagnosticIntroHtml(),'Diagnóstico inicial');return shell(diagnosticResultHtml(active)+diagnosticEvolutionHtml(),'Diagnóstico inicial')}
function diagnosticIntroHtml(){return `${pageTitle('PONTO DE PARTIDA','Diagnóstico inicial','Escolha entre uma triagem rápida de 20 questões ou um diagnóstico completo de 60.','')}<div class="diag-hero"><div><span class="eyebrow" style="color:#bfe9df">NÍVEL DE FUNDAMENTOS • ENSINO MÉDIO</span><h3>Antes de estudar tudo, descubra o que já está firme e o que precisa de base.</h3><p>Este não é um simulado de dificuldade final da FGV. As questões são introdutórias, com Física conceitual e cálculos simples, além dos conhecimentos básicos do edital. O resultado cria um ponto de partida sem marcar automaticamente nenhum conteúdo como dominado.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn light" id="startDiagnosticFull">Diagnóstico completo — 60</button><button class="btn ghost" style="color:white;border-color:rgba(255,255,255,.35)" id="startDiagnosticQuick">Rápido — 20</button></div></div><div class="diag-spec"><div><b>60</b><small>modo completo</small></div><div><b>20</b><small>modo rápido</small></div><div><b>A–E</b><small>5 alternativas</small></div><div><b>Sem pressão</b><small>sem tempo obrigatório</small></div></div></div><div class="diag-mode-grid"><article class="diag-mode-card"><span class="eyebrow">RECOMENDADO NA 1ª VEZ</span><h4>Diagnóstico completo</h4><p>60 questões: 10 Português, 5 Raciocínio, 5 Atualidades, 10 Pedagógicos e 30 Física. Gera o mapa mais detalhado.</p><button class="btn primary" id="startDiagnosticFull2">Começar 60 questões</button></article><article class="diag-mode-card"><span class="eyebrow">QUANDO O TEMPO ESTIVER CURTO</span><h4>Diagnóstico rápido</h4><p>20 questões selecionadas para uma triagem de base. Útil para repetir depois e verificar se os pontos fracos mudaram.</p><button class="btn ghost" id="startDiagnosticQuick2">Começar 20 questões</button></article></div><article class="panel" style="margin-top:16px"><span class="eyebrow">COMO O DIAGNÓSTICO INTERPRETA SUA RESPOSTA</span><h3>Acerto e confiança são coisas diferentes</h3><div class="diag-grid"><div class="diag-mini"><small>Acertou + certeza</small><b>Base provável</b></div><div class="diag-mini"><small>Acertou + dúvida</small><b>Consolidar</b></div><div class="diag-mini"><small>Acertou + chute</small><b>Revisar</b></div><div class="diag-mini"><small>Errou + dúvida</small><b>Lacuna</b></div><div class="diag-mini"><small>Errou + certeza</small><b>Alerta</b></div></div><p class="source-strip">As questões são autorais e servem para diagnóstico de fundamentos. A prova oficial pode exigir interpretação e integração de conceitos em nível maior.</p></article>`}
function diagnosticQuestionHtml(d){const qs=diagnosticQuestionsFor(d),i=clamp(d.index,0,qs.length-1),q=qs[i],ans=d.answers[i],conf=d.confidences?.[i]||null,answered=d.answers.filter(x=>x!=null).length;const letters=['A','B','C','D','E'];return `${pageTitle('DIAGNÓSTICO',`Questão ${i+1} de ${qs.length}`,`${q.discipline} • ${q.area} • ${q.topic}`,'')}<article class="panel diag-question"><div class="q-number">${d.mode==='quick'?'DIAGNÓSTICO RÁPIDO':'DIAGNÓSTICO COMPLETO'} • ${q.discipline} • ${q.area}</div><div class="diag-progress"><span style="width:${Math.round((i+1)/qs.length*100)}%"></span></div><h3>${esc(q.q)}</h3><div class="diag-options">${q.opts.map((o,j)=>`<button class="diag-option ${ans===j?'selected':''}" data-diag-opt="${j}"><span class="diag-letter">${letters[j]}</span><span>${esc(o)}</span></button>`).join('')}</div><div class="diag-confidence"><small>Quão seguro você está desta resposta? (opcional, mas melhora o diagnóstico)</small><div class="diag-confidence-row"><button class="diag-confidence-btn ${conf==='guess'?'selected':''}" data-diag-conf="guess">🎲 Chutei</button><button class="diag-confidence-btn ${conf==='medium'?'selected':''}" data-diag-conf="medium">🤔 Mais ou menos</button><button class="diag-confidence-btn ${conf==='sure'?'selected':''}" data-diag-conf="sure">✓ Tenho certeza</button></div></div><div class="diag-nav"><button class="btn ghost" id="diagPrev" ${i===0?'disabled':''}>← Anterior</button><span class="help">${answered}/${qs.length} respondidas</span><div><button class="btn ghost" id="diagSkip">Não sei / deixar em branco</button> ${i===qs.length-1?'<button class="btn primary" id="diagFinish">Finalizar diagnóstico</button>':'<button class="btn primary" id="diagNext">Próxima →</button>'}</div></div><div class="diag-palette">${qs.map((x,j)=>`<button class="diag-dot ${d.answers[j]!=null?'done':''} ${j===i?'now':''}" data-diag-jump="${j}" title="Questão ${j+1}">${j+1}</button>`).join('')}</div></article><div class="source-strip" style="max-width:860px;margin:auto">As respostas corretas só são mostradas após a finalização, para preservar o valor diagnóstico.</div>`}
function diagnosticResultHtml(a){const qs=diagnosticQuestionsFor(a),total=diagStats(a),basic=diagStats(a,q=>q.discipline!=='Física'),phy=diagStats(a,q=>q.discipline==='Física'),band=diagBand(total.pct);const disciplines=['Língua Portuguesa','Raciocínio Lógico','Atualidades','Conhecimentos Pedagógicos','Física'];const presentDisciplines=disciplines.filter(d=>qs.some(q=>q.discipline===d));const physAreas=[...new Set(qs.filter(q=>q.discipline==='Física').map(q=>q.area))];const allAreas=[...new Set(qs.map(q=>q.discipline==='Física'?`Física • ${q.area}`:`${q.discipline} • ${q.area}`))].map(label=>{const [d,...rest]=label.split(' • '),area=rest.join(' • ');const st=diagStats(a,q=>q.discipline===d&&q.area===area);return {label,...st}}).sort((x,y)=>x.pct-y.pct||x.total-y.total);const weak=allAreas.slice(0,6),review=state.diagnostic.review;const pairs=diagnosticPairs(a),sureWrong=pairs.filter(({q,i})=>a.answers?.[i]!==q.a&&a.answers?.[i]!=null&&a.confidences?.[i]==='sure').length,guessCorrect=pairs.filter(({q,i})=>a.answers?.[i]===q.a&&a.confidences?.[i]==='guess').length,confidentCorrect=pairs.filter(({q,i})=>a.answers?.[i]===q.a&&a.confidences?.[i]==='sure').length;return `${pageTitle('RESULTADO','Seu ponto de partida',`Diagnóstico ${a.mode==='quick'?'rápido':'completo'} concluído em ${fmtDate(a.date)} • ${total.correct}/${total.total} acertos`, `<button class="btn ghost" id="diagNew">Novo diagnóstico</button>`)}<article class="panel"><div class="diag-result-head"><div class="diag-score" style="--p:${total.pct}"><div><b>${total.pct}%</b><small>${total.correct}/${total.total}</small></div></div><div><span class="eyebrow">${band[1]} ${band[0]}</span><h3>${diagAction(total.pct)}</h3><p class="help">O objetivo não é aprovar ou reprovar você neste teste, e sim localizar lacunas. Um único acerto não marca conteúdo como dominado; erros, respostas em branco e baixa confiança aumentam a necessidade de revisão.</p><div class="two-col" style="margin-top:10px"><div class="muted-box"><b>Conhecimentos Básicos</b><br>${basic.correct}/${basic.total} • ${basic.pct}%</div><div class="muted-box"><b>Física</b><br>${phy.correct}/${phy.total} • ${phy.pct}%</div></div></div></div><div class="diag-grid">${presentDisciplines.map(d=>{const x=diagStats(a,q=>q.discipline===d);return `<div class="diag-mini"><small>${d}</small><b>${x.pct}%</b><span class="help">${x.correct}/${x.total}</span></div>`}).join('')}</div><div class="diag-insight"><div><small>Acertos com certeza</small><b>${confidentCorrect}</b></div><div><small>Acertos por chute</small><b>${guessCorrect}</b></div><div><small>Erros com certeza</small><b>${sureWrong}</b><span class="help">merecem revisão conceitual</span></div></div></article><article class="panel" style="margin-top:16px"><span class="eyebrow">COMECE POR AQUI</span><h3>Áreas com menor domínio diagnóstico</h3>${weak.map(x=>{const b=diagBand(x.pct);return `<div class="diag-area-row"><div><strong>${x.label}</strong><small class="help">${diagAction(x.pct)}</small></div><div class="diag-progress"><span style="width:${x.pct}%"></span></div><b>${x.pct}%</b><span class="diag-band">${b[1]} ${b[0]}</span></div>`}).join('')}<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:15px">${a.applied?'<span class="success-banner" style="margin:0">✓ Resultado já incorporado às prioridades do aplicativo.</span>':'<button class="btn primary" id="diagApply">Usar resultado no meu plano de estudos</button>'}<button class="btn ghost" id="diagToggleReview">${review?'Ocultar correção':`Revisar as ${total.total} questões`}</button></div></article><article class="panel" style="margin-top:16px"><span class="eyebrow">FÍSICA • MAPA DE BASE</span><h3>Onde estão as principais lacunas em Física</h3>${physAreas.map(ar=>{const x=diagStats(a,q=>q.discipline==='Física'&&q.area===ar),b=diagBand(x.pct);return `<div class="diag-area-row"><div><strong>${ar}</strong><small class="help">${x.correct}/${x.total} acertos</small></div><div class="diag-progress"><span style="width:${x.pct}%"></span></div><b>${x.pct}%</b><span class="diag-band">${b[1]} ${b[0]}</span></div>`}).join('')}</article>${review?diagnosticReviewHtml(a):''}`}
function diagnosticReviewHtml(a){const L=['A','B','C','D','E'],qs=diagnosticQuestionsFor(a),cl={guess:'Chutei',medium:'Mais ou menos',sure:'Tenho certeza'};return `<article class="panel" style="margin-top:16px"><span class="eyebrow">CORREÇÃO COMENTADA</span><h3>Diagnóstico ${a.mode==='quick'?'rápido':'completo'}</h3>${qs.map((q,i)=>{const got=a.answers?.[i],ok=got===q.a,conf=a.confidences?.[i];return `<div class="diag-review ${ok?'correct':'wrong'}"><small>Questão ${i+1} • ${q.discipline} • ${q.area}${conf?' • confiança: '+cl[conf]:''}</small><h4>${esc(q.q)}</h4><p class="ans">Sua resposta: ${got==null?'Em branco':L[got]+' — '+esc(q.opts[got])}</p><p class="ans">Correta: ${L[q.a]} — ${esc(q.opts[q.a])}</p><p>${esc(q.ex)}</p>${!ok&&conf==='sure'?'<p><b>⚠ Você errou com alta confiança.</b> Isso pode indicar uma concepção que merece revisão desde a base.</p>':''}${ok&&conf==='guess'?'<p><b>↻ Acerto por chute.</b> O sistema mantém este conteúdo como candidato a revisão.</p>':''}</div>`}).join('')}</article>`}
function bindDiagnostic(){const d=state.diagnostic.draft;if(!d){['startDiagnosticFull','startDiagnosticFull2'].forEach(id=>$(id)?.addEventListener('click',()=>startDiagnostic('full')));['startDiagnosticQuick','startDiagnosticQuick2'].forEach(id=>$(id)?.addEventListener('click',()=>startDiagnostic('quick')));$('diagNew')?.addEventListener('click',()=>{state.diagnostic.activeResultId=null;state.diagnostic.review=false;save(true);render()});$('diagApply')?.addEventListener('click',()=>applyDiagnostic(state.diagnostic.activeResultId||[...state.diagnostic.attempts].sort((a,b)=>(b.completedAt||'').localeCompare(a.completedAt||''))[0]?.id));$('diagToggleReview')?.addEventListener('click',()=>{state.diagnostic.review=!state.diagnostic.review;save(true);render()});$('diagEvolution')?.addEventListener('click',()=>startDiagnostic('evolution'));$('diagSeeFirst')?.addEventListener('click',()=>{const first=[...state.diagnostic.attempts].sort((a,b)=>(a.completedAt||'').localeCompare(b.completedAt||''))[0];if(first){state.diagnostic.activeResultId=first.id;save(true);render()}});return}const qs=diagnosticQuestionsFor(d);if(!Array.isArray(d.confidences))d.confidences=Array(qs.length).fill(null);document.querySelectorAll('[data-diag-opt]').forEach(e=>e.onclick=()=>{d.answers[d.index]=+e.dataset.diagOpt;save(true);render()});document.querySelectorAll('[data-diag-conf]').forEach(e=>e.onclick=()=>{d.confidences[d.index]=e.dataset.diagConf;save(true);render()});document.querySelectorAll('[data-diag-jump]').forEach(e=>e.onclick=()=>{d.index=+e.dataset.diagJump;save(true);render()});$('diagPrev')?.addEventListener('click',()=>{d.index=Math.max(0,d.index-1);save(true);render()});$('diagNext')?.addEventListener('click',()=>{d.index=Math.min(qs.length-1,d.index+1);save(true);render()});$('diagSkip')?.addEventListener('click',()=>{d.answers[d.index]=null;d.confidences[d.index]=null;if(d.index<qs.length-1)d.index++;save(true);render()});$('diagFinish')?.addEventListener('click',finishDiagnostic)}

function errorsView(){const recurrent=errorRecurrence();return shell(`${pageTitle('CADERNO DE ERROS','Erros que viram plano de estudo','Classifique a causa, o tipo de erro em Física e marque favoritos para a revisão final.','<button class="btn primary" id="newError">+ Registrar erro</button>')} ${recurrent.length?`<div class="warning-banner"><b>Padrões recorrentes:</b> ${recurrent.slice(0,3).map(x=>x.label+' ('+x.count+'x)').join(' • ')}</div>`:''}<div class="error-list">${state.errors.map(e=>`<div class="question-card ${recurrent.some(r=>r.key===(e.physicsType||e.reason))?'recurring':''}"><small>${e.bank||'FGV'} • ${e.year||''} • ${fmtDate(e.date)} ${e.favorite?'★':''}</small><h4>${esc(e.title||topics.find(t=>t.id===e.topicId)?.title)}</h4><p class="help">${esc(e.note||'Sem anotação')}</p><div class="tags"><span>${e.reason||'erro'}</span>${e.physicsType?`<span>${e.physicsType}</span>`:''}${(e.tags||[]).map(x=>`<span>#${esc(x)}</span>`).join('')}</div><button class="link-btn" data-error-fav="${e.id}">${e.favorite?'★ favorito':'☆ favoritar'}</button> <button class="link-btn" data-error-resolve="${e.id}">${e.resolved?'reabrir':'resolvido'}</button> <button class="danger-link" data-error-del="${e.id}">excluir</button></div>`).join('')||'<article class="panel empty"><span>!</span><p>Nenhum erro individual registrado.</p></article>'}</div><div id="errorForm"></div>`,'Caderno de erros')}
function errorRecurrence(){const m={};state.errors.filter(e=>!e.resolved).forEach(e=>{const k=e.physicsType||e.reason||'Outro';m[k]=(m[k]||0)+1});return Object.entries(m).map(([key,count])=>({key,label:key,count})).filter(x=>x.count>=3).sort((a,b)=>b.count-a.count)}
function simuladosView(){const last=latestSim();return shell(`${pageTitle('SIMULADOS','Simulado SEDUC-PA','Registre as cinco disciplinas para verificar os critérios eliminatórios de treino.')}<div class="two-col"><article class="panel"><div class="form-grid-5"><div class="field"><label>Português /10</label><input id="simPt" type="number" min="0" max="10" value="0"></div><div class="field"><label>Raciocínio /5</label><input id="simRl" type="number" min="0" max="5" value="0"></div><div class="field"><label>Atualidades /5</label><input id="simAt" type="number" min="0" max="5" value="0"></div><div class="field"><label>Pedagógicos /10</label><input id="simPed" type="number" min="0" max="10" value="0"></div><div class="field"><label>Física /30</label><input id="simFis" type="number" min="0" max="30" value="0"></div></div><div class="form-grid-2" style="margin-top:10px"><div class="field"><label>Tempo total (min)</label><input id="simMin" type="number" value="240"></div><div class="field"><label>Data</label><input id="simDate" type="date" value="${today()}"></div></div><div id="simPreview" class="sim-result">Preencha seus acertos.</div><button class="btn primary full" id="saveSim">Salvar simulado</button><p class="help">Referência de treino: Básicos ≥ 50%, Específicos ≥ 50% e nenhum bloco zerado. O edital é a fonte oficial dos critérios.</p></article><aside class="panel"><span class="eyebrow">ÚLTIMO RESULTADO</span>${last?`<div class="score-box">${last.percent}%</div><h3>${last.ok?'Critérios de treino atendidos':'Há critério de treino não atendido'}</h3><p class="help">${fmtDate(last.date)} • ${last.minutes} min</p>${progressBar(last.percent)}`:'<div class="empty"><p>Registre o primeiro simulado.</p></div>'}</aside></div><article class="panel" style="margin-top:16px"><span class="eyebrow">EVOLUÇÃO</span><h3>Histórico de simulados</h3>${state.simulations.length?`<div class="table-wrap"><table><thead><tr><th>Data</th><th>Básicos</th><th>Física</th><th>Total</th><th>Tempo</th function discursivaView(){const avg=state.discursives.length?(state.discursives.reduce((a,b)=>a+b.score,0)/state.discursives.length).toFixed(1):'—';return shell(`${pageTitle('PROVA DISCURSIVA','Treino de situações-problema','O edital prevê 2 respostas, de 15 a 30 linhas, totalizando 10 pontos.')}<div class="two-col"><article class="panel"><div class="field"><label>Tema / situação-problema</label><textarea id="discTheme" placeholder="Descreva o caso escolar ou tema treinado."></textarea></div><div class="form-grid-3"><div class="field"><label>Linhas</label><input id="discLines" type="number" min="0" value="20"></div><div class="field"><label>Nota total /10</label><input id="discScore" type="number" min="0" max="10" step="0.1" value="0"></div><div class="field"><label>Data</label><input id="discDate" type="date" value="${today()}"></div></div><div class="field" style="margin-top:10px"><label>Reflexão</label><textarea id="discNotes" placeholder="Clareza, precisão, consistência, concisão, aspectos a melhorar..."></textarea></div><button class="btn primary full" id="saveDisc">Salvar treino</button></article><aside class="panel"><span class="eyebrow">EVOLUÇÃO</span><h3>Média registrada: ${avg}/10</h3>${state.discursives.length?state.discursives.slice(0,6).map(d=>`<div class="review-item"><div><strong>${esc(d.theme||'Treino discursivo')}</strong><small>${fmtDate(d.date)} • ${d.lines} linhas</small></div><b>${d.score}/10</b></div>`).join(''):'<div class="empty"><p>Nenhum treino registrado.</p></div>'}<div class="muted-box">Use esta área para acompanhar sua própria correção ou notas recebidas em treinos. A correção oficial é da banca.</div></aside></div>`,'Discursiva')}
function praticaView(){const themes=topics.filter(t=>t.discipline==='Física'),avg=state.practicals.length?(state.practicals.reduce((a,b)=>a+b.plan+b.defense,0)/state.practicals.length).toFixed(1):'—';return shell(`${pageTitle('PROVA PRÁTICA','Plano de aula & defesa','Treine o formato do edital: Plano 4 pontos + Defesa 6 pontos.')}<div class="two-col"><article class="panel"><div class="field"><label>Tema</label><select id="pracTheme">${themes.map(t=>`<option>${t.title}</option>`).join('')}</select></div><button class="btn ghost" id="randomTheme" style="margin-bottom:12px">🎲 Sortear tema de Física</button><div class="form-grid-3"><div class="field"><label>Plano /4</label><input id="pracPlan" type="number" min="0" max="4" step="0.1" value="0"></div><div class="field"><label>Defesa /6</label><input id="pracDefense" type="number" min="0" max="6" step="0.1" value="0"></div><div class="field"><label>Data</label><input id="pracDate" type="date" value="${today()}"></div></div><div class="field" style="margin-top:10px"><label>Observações</label><textarea id="pracNotes" placeholder="Domínio técnico, coerência, linguagem, estratégias didático-pedagógicas..."></textarea></div><button class="btn primary full" id="savePrac">Salvar treino</button></article><aside class="panel"><span class="eyebrow">EVOLUÇÃO</span><h3>Média: ${avg}/10</h3>${state.practicals.length?state.practicals.slice(0,6).map(p=>`<div class="review-item"><div><strong>${esc(p.theme)}</strong><small>${fmtDate(p.date)} • plano ${p.plan}/4 • defesa ${p.defense}/6</small></div><b>${(p.plan+p.defense).toFixed(1)}</b></div>`).join(''):'<div class="empty"><p>Nenhum treino registrado.</p></div>'}<div class="muted-box">Referência do edital: aprovação com pelo menos 50% do total e eliminação se houver zero na etapa Plano ou Defesa.</div></aside></div>`,'Prova prática')}
function calendarView(){const d=new Date(),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),start=(first.getDay()+6)%7;let cells='';for(let i=0;i<start;i++)cells+='<div class="calendar-day empty-day"></div>';for(let day=1;day<=last.getDate();day++){const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(day).padStart(2,'0'),mins=Math.round(state.sessions.filter(s=>s.date===ds).reduce((a,b)=>a+b.durationSeconds,0)/60),cls=mins>=state.settings.dailyMinutesGoal?'hit':mins>0?'partial':'none';cells+=`<div class="calendar-day ${cls}"><div class="n">${day}</div><div class="mins">${mins?mins+' min':'—'}</div></div>`}return shell(`${pageTitle('CALENDÁRIO',first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}),'Verde: meta diária atingida • amarelo: estudo parcial.')}<article class="panel"><div class="calendar-wrap">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(x=>`<div class="calendar-head">${x}</div>`).join('')}${cells}</div></article>`,'Calendário')}
function reportView(){const w=weekStats(0),p=weekStats(-1),delta=(a,b)=>a>b?'<span class="trend-up">▲</span>':a<b?'<span class="trend-down">▼</span>':'—',topGain=priorityList().slice().reverse()[0],risk=priorityList()[0],projection=projectionText(),ach=achievementData(),fresh=ach.filter(a=>a.done&&!((state.achievementsSeen||[]).includes(a.id)));return shell(`${pageTitle('RELATÓRIO','Relatório semanal & projeção','Compare semanas, ritmo, conquistas e distribuição de estudo.')}<div class="report-grid"><div class="report-stat"><small>Tempo</small><strong>${fmtDuration(w.time)}</strong></div><div class="report-stat"><small>Questões</small><strong>${w.total}</strong></div><div class="report-stat"><small>Acertos</small><strong>${w.acc}%</strong></div><div class="report-stat"><small>Revisões</small><strong>${w.revs}</strong></div><div class="report-stat"><small>Sessões</small><strong>${w.sessions}</strong></div></div><div class="two-col"><article class="panel"><span class="eyebrow">SEMANA ATUAL × ANTERIOR</span><table class="compare-table"><tr><th>Métrica</th><th>Anterior</th><th>Atual</th><th></th></tr><tr><td>Tempo</td><td>${fmtDuration(p.time)}</td><td>${fmtDuration(w.time)}</td><td>${delta(w.time,p.time)}</td></tr><tr><td>Questões</td><td>${p.total}</td><td>${w.total}</td><td>${delta(w.total,p.total)}</td></tr><tr><td>Acertos</td><td>${p.acc}%</td><td>${w.acc}%</td><td>${delta(w.acc,p.acc)}</td></tr><tr><td>Revisões</td><td>${p.revs}</td><td>${w.revs}</td><td>${delta(w.revs,p.revs)}</td></tr></table><div class="success-banner" style="margin-top:14px"><b>Maior estabilidade:</b> ${topGain?.title||'dados insuficientes'}<br><b>Principal risco:</b> ${risk?.title||'dados insuficientes'}.</div></article><aside class="panel"><span class="eyebrow">PROJEÇÃO</span><h3>Ritmo até 29/11</h3>${projection}<div class="field" style="margin-top:12px"><label>Meta para concluir 1º ciclo</label><input id="cycleTarget" type="date" value="${state.settings.firstCycleTarget}"></div><button class="btn ghost small" id="saveCycle">Salvar meta</button>${achievementSummaryHtml()}</aside></div><div class="report-chart-grid">${weeklyEvolutionChartHtml()}${questionVolumeChartHtml()}</div><div class="report-chart-grid">${disciplineBarsChartHtml()}${statusDistributionChartHtml()}</div><article class="panel" style="margin-top:16px"><span class="eyebrow">DISTRIBUIÇÃO DO TEMPO</span><h3>Onde as horas estão indo</h3>${timeDistribution()}</article><article class="panel" style="margin-top:16px"><div class="panel-head"><div><span class="eyebrow">CONQUISTAS</span><h3>Marcos de preparação</h3></div>${fresh.length?`<span class="pill">${fresh.length} nova(s)</span>`:''}</div>${achievementsHtml()}</article>`,'Relatórios')}
function groupStats(){const groups=[...new Set(topics.map(t=>t.discipline+'||'+t.group))];return groups.map(k=>{const [discipline,group]=k.split('||'),ts=topics.filter(t=>t.discipline===discipline&&t.group===group);const cov=Math.round(ts.reduce((a,t)=>a+statusInfo[getProgress(t.id).status][1],0)/ts.length);const records=state.questionSessions.filter(q=>ts.some(t=>t.id===q.topicId)),tot=records.reduce((a,b)=>a+b.total,0),cor=records.reduce((a,b)=>a+b.correct,0),acc=tot?Math.round(cor/tot*100):null;return {discipline,group,cov,acc,score:acc===null?cov:Math.round((acc+cov)/2)}})}
function heatmapHtml(){return `<div class="heatmap">${groupStats().map(g=>`<div class="heat-row heat-${g.score>=75?'good':g.score>=50?'mid':g.score?'low':'none'}"><div><strong>${g.group}</strong><small>${g.discipline}</small></div><div class="heat-bar"><i style="width:${g.score}%"></i></div><b>${g.acc===null?g.cov:g.score}%</b></div>`).join('')}</div>`}
function timeDistribution(){const sum=state.sessions.reduce((a,b)=>a+b.durationSeconds,0)||1;return `<div class="barlist">${Object.keys(disciplineWeights).map(d=>{const s=state.sessions.filter(x=>x.discipline===d).reduce((a,b)=>a+b.durationSeconds,0),p=Math.round(s/sum*100);return `<div class="barrow"><small>${d}</small><div class="bar"><i style="width:${p}%"></i></div><b>${p}%</b></div>`}).join('')}</div>`}

/button><span class="pill">${idx+1}/${pool.length}</span><button ${!next?'disabled':''} data-next-topic="${next?.id||''}">${next?esc(next.title):'Fim do bloco'} →</button></div></article><aside class="panel setup-panel"><span class="eyebrow">PREPARAR SESSÃO</span><h3>Uma meta por vez</h3><label>Conteúdo<select id="timerTopic">${topics.map(x=>`<option value="${x.id}" ${x.id===timer.topicId?'selected':''}>${x.discipline} • ${x.group} • ${x.title}</option>`).join('')}</select></label><label>Tipo<select id="timerType">${sessionTypes.map(x=>`<option ${x===timer.type?'selected':''}>${x}</option>`).join('')}</select></label><label>Objetivo específico<input id="timerObjective" value="${esc(timer.objective)}" placeholder="Ex.: resolver 20 questões FGV"></label><div class="tabline">${[15,20,30,50,0].map(n=>`<button data-preset="${n}" class="${timer.preset===n?'active':''}">${n||'Livre'}${n?' min':''}</button>`).join('')}</div><button class="btn primary full" id="finishSession">Finalizar e salvar sessão</button><p class="help">Ao salvar, o conteúdo entra no histórico e influencia as recomendações.</p></aside></div>`,'Foco & Cronômetro')}
function projectionText(){const active=state.progress.filter(p=>p.status!=='nao_iniciado'),startedIds=new Set(active.map(p=>p.topicId)),remainingTopics=topics.filter(t=>!startedIds.has(t.id)),remainingMin=remainingTopics.reduce((a,t)=>a+(t.minutes||20),0),cutoff=addDays(today(),-28),recentIds=new Set(active.filter(p=>p.updatedAt?.slice(0,10)>=cutoff).map(p=>p.topicId)),recentMin=topics.filter(t=>recentIds.has(t.id)).reduce((a,t)=>a+(t.minutes||20),0),paceMin=recentMin/4;if(!active.length||paceMin<15)return `<div class="muted-box">Ainda não há dados suficientes. Conclua algumas micro-unidades para calcular a projeção pelo seu ritmo real.</div>`;const weeks=remainingMin/paceMin,projected=addDays(today(),Math.ceil(weeks*7)),target=state.settings.firstCycleTarget,ok=projected<=target;return `<div class="${ok?'success-banner':'warning-banner'}"><b>${ok?'Ritmo compatível':'Ritmo precisa aumentar'}</b><br>Ritmo recente: ≈ ${(paceMin/60).toFixed(1)} h de microconteúdos/semana.<br>Restante estimado do 1º ciclo: ≈ ${(remainingMin/60).toFixed(1)} h.<br>Conclusão projetada: ${fmtDate(projected)}.<br>Meta de 1º ciclo: ${fmtDate(target)}.</div>`}

function bindCommon(){document.querySelectorAll('[data-view]').forEach(e=>e.onclick=()=>navigate(e.dataset.view));$('openSearch')?.addEventListener('click',openSearch);$('themeToggle')?.addEventListener('click',()=>{state.settings.theme=state.settings.theme==='dark'?'light':'dark';applyTheme();save(true);render()});$('smartBack')?.addEventListener('click',goBack);$('nextBestBtn')?.addEventListener('click',startNextBest);$('todayBestAction')?.addEventListener('click',startNextBest);$('collapseSidebar')?.addEventListener('click',()=>{state.settings.sidebarCollapsed=!state.settings.sidebarCollapsed;save(true);render()});$('quickAddBtn')?.addEventListener('click',e=>{e.stopPropagation();$('fabMenu')?.classList.toggle('on')});document.querySelectorAll('[data-quick-action]').forEach(e=>e.onclick=()=>quickAction(e.dataset.quickAction));document.querySelectorAll('[data-topic-focus]').forEach(e=>e.onclick=()=>{timer.topicId=e.dataset.topicFocus;timer.type='Teoria';navigate('timer')});document.querySelectorAll('[data-resume-topic]').forEach(e=>e.onclick=()=>{timer.topicId=e.dataset.resumeTopic;timer.type=getProgress(timer.topicId).status==='revisando'?'Revisão':'Teoria';timer.preset=topics.find(t=>t.id===timer.topicId)?.minutes||20;navigate('timer')});document.querySelectorAll('[data-pin-topic]').forEach(e=>e.onclick=()=>togglePin(e.dataset.pinTopic));document.querySelectorAll('[data-done-task]').forEach(e=>e.onclick=()=>markTask(e.dataset.doneTask));document.querySelectorAll('[data-start-task]').forEach(e=>e.onclick=()=>startTask(e.dataset.startTask));document.querySelectorAll('[data-time-now]').forEach(e=>e.onclick=()=>suggestForTime(+e.dataset.timeNow));document.querySelectorAll('[data-context-view]').forEach(e=>e.onclick=()=>contextJump(e.dataset.contextView));document.querySelectorAll('[data-prev-topic],[data-next-topic]').forEach(e=>e.onclick=()=>{const id=e.dataset.prevTopic||e.dataset.nextTopic;if(id){timer.topicId=id;timer.seconds=0;render()}});$('generateWeekPlanBtn')?.addEventListener('click',generateWeekPlan);document.querySelectorAll('[data-week-done]').forEach(e=>e.onclick=()=>toggleWeekTask(e.dataset.weekDone));document.querySelectorAll('[data-week-start]').forEach(e=>e.onclick=()=>startWeekTask(e.dataset.weekStart))}

function bindTimer(){const update=()=>{$('timerDisplay')&&($('timerDisplay').textContent=fmtClock(timer.seconds));const fd=$('focusTime');if(fd)fd.textContent=fmtClock(timer.seconds)};$('timerTopic').onchange=e=>{timer.topicId=e.target.value;const t=topics.find(x=>x.id===timer.topicId);timer.preset=t?.minutes||20;timer.seconds=0;render()};$('timerType').onchange=e=>timer.type=e.target.value;$('timerObjective').oninput=e=>timer.objective=e.target.value;document.querySelectorAll('[data-preset]').forEach(e=>e.onclick=()=>{timer.preset=+e.dataset.preset;timer.seconds=0;render()});$('timerToggle').onclick=()=>{if(timer.running){clearInterval(timer.handle);timer.handle=null;timer.running=false;render()}else{timer.running=true;let last=Date.now();timer.handle=setInterval(()=>{const now=Date.now(),d=Math.floor((now-last)/1000);if(d>0){timer.seconds+=d;last=now;update()}},250);render()}};$('timerReset').onclick=()=>{clearInterval(timer.handle);timer.running=false;timer.seconds=0;render()};$('focusMode').onclick=()=>openFocus();$('finishSession').onclick=finishTimer}
function openFocus(){const t=topics.find(x=>x.id===timer.topicId)||topics[0],pool=topics.filter(x=>x.discipline===t.discipline&&x.group===t.group),idx=pool.findIndex(x=>x.id===t.id),prev=idx>0?pool[idx-1]:null,next=idx>=0&&idx<pool.length-1?pool[idx+1]:null,o=$('focusOverlay');o.innerHTML=`<div class="focus-shell"><span class="focus-mark">${uiIcon('spark',14)} DEEP FOCUS</span><div class="focus-path">${esc(t.discipline)} › ${esc(t.group)}</div><div class="focus-topic">${esc(t.title)}</div><div class="timer-display" id="focusTime">${fmtClock(timer.seconds)}</div><div class="focus-objective">${esc(timer.objective||'Uma tarefa por vez. Defina o objetivo da sessão antes de começar.')}</div><div class="focus-controls"><button class="btn primary big" id="focusToggle">${timer.running?'Pausar':'Iniciar'}</button><button class="btn ghost big" id="focusFinish">Finalizar sessão</button><button class="btn ghost big" id="closeFocus">Sair do foco</button></div><div class="focus-progress-nav"><button ${!prev?'disabled':''} id="focusPrev">← ${prev?esc(prev.title):'Início do bloco'}</button><span>${idx+1} de ${pool.length}</span><button ${!next?'disabled':''} id="focusNext">${next?esc(next.title):'Fim do bloco'} →</button></div><div class="focus-finish">Menu, métricas e distrações ficam ocultos enquanto este modo estiver aberto.</div></div>`;o.classList.add('on');$('closeFocus').onclick=()=>o.classList.remove('on');$('focusToggle').onclick=()=>{o.classList.remove('on');$('timerToggle')?.click();setTimeout(openFocus,30)};$('focusFinish').onclick=()=>{o.classList.remove('on');finishTimer()};$('focusPrev')?.addEventListener('click',()=>{if(prev){timer.topicId=prev.id;timer.seconds=0;openFocus()}});$('focusNext')?.addEventListener('click',()=>{if(next){timer.topicId=next.id;timer.seconds=0;openFocus()}})}
function finishTimer(){if(timer.seconds<5)return alert('Registre pelo menos 5 segundos.');clearInterval(timer.handle);const t=topics.find(x=>x.id===timer.topicId);state.sessions.unshift({id:uid(),topicId:t.id,discipline:t.discipline,topicTitle:t.title,type:timer.type,durationSeconds:timer.seconds,date:today(),objective:timer.objective,createdAt:new Date().toISOString()});if(getProgress(t.id).status==='nao_iniciado')setProgress(t.id,'estudando');else save();timer.seconds=0;timer.running=false;timer.handle=null;toast('Sessão salva.');render()}
function bindContents(){document.querySelectorAll('[data-content-mode]').forEach(e=>e.onclick=()=>{contentAreaMode=e.dataset.contentMode;render()});if(contentAreaMode!=='edital')return;const refresh=()=>{$('topicList').innerHTML=topicListHtml(contentDisciplineFilter,contentTimeMax,contentStatusFilter);bindTopicStatus()};document.querySelectorAll('[data-dfilter]').forEach(e=>e.onclick=()=>{contentDisciplineFilter=e.dataset.dfilter;document.querySelectorAll('[data-dfilter]').forEach(b=>b.classList.toggle('active',b.dataset.dfilter===contentDisciplineFilter));refresh()});document.querySelectorAll('[data-tfilter]').forEach(e=>e.onclick=()=>{contentTimeMax=+e.dataset.tfilter;document.querySelectorAll('[data-tfilter]').forEach(b=>b.classList.toggle('active',+b.dataset.tfilter===contentTimeMax));refresh()});document.querySelectorAll('[data-quick-min]').forEach(e=>e.onclick=()=>{contentTimeMax=+e.dataset.quickMin;document.querySelectorAll('[data-tfilter]').forEach(b=>b.classList.toggle('active',+b.dataset.tfilter===contentTimeMax));refresh();$('topicList')?.scrollIntoView({behavior:'smooth',block:'start'})});document.querySelectorAll('[data-status-card]').forEach(e=>e.onclick=()=>{contentStatusFilter=e.dataset.statusCard;render();$('topicList')?.scrollIntoView({behavior:'smooth',block:'start'})});bindTopicStatus()}
function bindTopicStatus(){document.querySelectorAll('[data-topic-status]').forEach(e=>e.onchange=()=>{setProgress(e.dataset.topicStatus,e.value);toast('Progresso atualizado.');render()});document.querySelectorAll('[data-apply-suggest]').forEach(e=>e.onclick=()=>{setProgress(e.dataset.applySuggest,e.dataset.suggestStatus);toast('Sugestão inteligente aplicada.');render()});document.querySelectorAll('[data-topic-focus]').forEach(e=>e.onclick=()=>{timer.topicId=e.dataset.topicFocus;const t=topics.find(x=>x.id===timer.topicId);timer.preset=t?.minutes||20;timer.seconds=0;current='timer';render()})}
function bindReviews(){document.querySelectorAll('[data-review-one]').forEach(e=>e.onclick=()=>{reviewMode=e.dataset.reviewOne;render()});$('startReviews')?.addEventListener('click',()=>{reviewMode=dueReviews()[0]?.id||null;render()});document.querySelectorAll('[data-review-rate]').forEach(e=>e.onclick=()=>rateReview(e.dataset.reviewRate))}
function bindCards(){$('newCard')?.addEventListener('click',()=>{$('cardForm').innerHTML=`<article class="panel" style="margin-top:16px"><div class="form-grid-2"><div class="field"><label>Conteúdo</label><select id="fcTopic">${topicOptions()}</select></div><div class="field"><label>Tags (separadas por vírgula)</label><input id="fcTags"></div></div><div class="field"><label>Frente</label><textarea id="fcFront"></textarea></div><div class="field"><label>Verso</label><textarea id="fcBack"></textarea></div><button class="btn primary" id="saveCard">Salvar cartão</button></article>`;$('saveCard').onclick=()=>{const f=$('fcFront').value.trim(),b=$('fcBack').value.trim();if(!f||!b)return alert('Preencha frente e verso.');state.flashcards.unshift({id:uid(),topicId:$('fcTopic').value,front:f,back:b,tags:$('fcTags').value.split(',').map(x=>x.trim()).filter(Boolean),due:today(),interval:1,ease:2.3,lapses:0,lastRating:null,favorite:false});save();render()}});$('showAnswer')?.addEventListener('click',()=>{$('cardAnswer').style.display='block';$('cardRatings').style.display='flex';$('showAnswer').style.display='none'});document.querySelectorAll('[data-card-rate]').forEach(e=>e.onclick=()=>rateCard(e.dataset.cardRate));document.querySelectorAll('[data-del-card]').forEach(e=>e.onclick=()=>{state.flashcards=state.flashcards.filter(c=>c.id!==e.dataset.delCard);save();render()})}
function rateCard(rating){const c=state.flashcards.filter(x=>(x.due||today())<=today())[0];if(!c)return;const map={errei:1,dificil:2,bom:3,facil:4},v=map[rating];c.lastRating=rating;if(v===1){c.interval=1;c.lapses=(c.lapses||0)+1}else if(v===2)c.interval=Math.max(2,Math.round(c.interval*1.4));else if(v===3)c.interval=Math.max(3,Math.round(c.interval*2));else c.interval=Math.max(7,Math.round(c.interval*3));c.due=addDays(today(),Math.min(60,c.interval));save();render()}
function bindFormulas(){document.querySelectorAll('[data-formula-lapse]').forEach(e=>e.onclick=()=>{const f=state.formulas.find(x=>x.id===e.dataset.formulaLapse);f.lapses=(f.lapses||0)+1;f.last=today();save();render()});document.querySelectorAll('[data-formula-ok]').forEach(e=>e.onclick=()=>{const f=state.formulas.find(x=>x.id===e.dataset.formulaOk);f.last=today();save();toast('Lembrança registrada.')});document.querySelectorAll('[data-formula-fav]').forEach(e=>e.onclick=()=>{const f=state.formulas.find(x=>x.id===e.dataset.formulaFav);f.favorite=!f.favorite;save();render()});document.querySelectorAll('[data-micro-option]').forEach(e=>e.onclick=()=>{const q=microQuestions[microIndex%microQuestions.length],i=+e.dataset.microOption;state.micro.answered++;if(i===q.a)state.micro.correct++;document.querySelectorAll('[data-micro-option]').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('microFeedback').innerHTML=(i===q.a?'✅ Correto. ':'❌ Revise. ')+q.ex+' <button class="link-btn" id="nextMicro">Próxima</button>';save(true);$('nextMicro').onclick=()=>{microIndex++;render()}})}
function bindQuestions(){document.querySelectorAll('[data-qtab]').forEach(e=>e.onclick=()=>{questionTab=e.dataset.qtab;render()});if(questionTab==='register'){const preview=()=>{const tot=+$('qrTotal').value||0,cor=+$('qrCorrect').value||0;$('qrPreview').textContent=(tot?Math.round(cor/tot*100):0)+'% de acertos'};$('qrTotal').oninput=preview;$('qrCorrect').oninput=preview;preview();$('saveQuestionSession').onclick=()=>{const t=topics.find(x=>x.id===$('qrTopic').value),total=+$('qrTotal').value,correct=+$('qrCorrect').value;if(total<=0||correct<0||correct>total)return alert('Confira total e acertos.');state.questionSessions.unshift({id:uid(),topicId:t.id,discipline:t.discipline,topicTitle:t.title,bank:$('qrBank').value.trim()||'FGV',year:+$('qrYear').value||2026,total,correct,wrong:total-correct,accuracy:Math.round(correct/total*100),reason:$('qrReason').value,notes:$('qrNotes').value,date:$('qrDate').value,createdAt:new Date().toISOString()});ensureReview(t.id);save();toast('Desempenho salvo e prioridades recalculadas.');render()}}if(questionTab==='bank'){$('saveBankQuestion').onclick=()=>{state.questionBank.unshift({id:uid(),topicId:$('qbTopic').value,bank:$('qbBank').value||'FGV',year:+$('qbYear').value||2026,ref:$('qbRef').value,prompt:$('qbPrompt').value,answer:$('qbAnswer').value,favorite:false,createdAt:new Date().toISOString()});save();render()};document.querySelectorAll('[data-qfav]').forEach(e=>e.onclick=()=>{const q=state.questionBank.find(x=>x.id===e.dataset.qfav);q.favorite=!q.favorite;save();render()});document.querySelectorAll('[data-qdel]').forEach(e=>e.onclick=()=>{state.questionBank=state.questionBank.filter(x=>x.id!==e.dataset.qdel);save();render()})}$('exportQuestionsCsv')?.addEventListener('click',exportQuestionCsv)}
function bindErrors(){$('newError')?.addEventListener('click',()=>{$('errorForm').innerHTML=`<article class="panel" style="margin-top:16px"><span class="eyebrow">NOVO ERRO</span><div class="form-grid-2"><div class="field"><label>Conteúdo</label><select id="erTopic">${topicOptions()}</select></div><div class="field"><label>Banca</label><input id="erBank" value="FGV"></div><div class="field"><label>Ano</label><input id="erYear" type="number" value="2026"></div><div class="field"><label>Motivo</label><select id="erReason">${errorReasons.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Tipo de erro em Física</label><select id="erPhys"><option value="">Não se aplica</option>${physicsErrors.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Tags</label><input id="erTags" placeholder="fgv, dificil, revisar"></div></div><div class="field"><label>Identificação / título</label><input id="erTitle" placeholder="Ex.: questão 42 — indução"></div><div class="field"><label>O que causou o erro e como corrigir?</label><textarea id="erNote"></textarea></div><button class="btn primary" id="saveError">Salvar erro</button></article>`;$('saveError').onclick=()=>{state.errors.unshift({id:uid(),topicId:$('erTopic').value,bank:$('erBank').value,year:+$('erYear').value||2026,reason:$('erReason').value,physicsType:$('erPhys').value,tags:$('erTags').value.split(',').map(x=>x.trim()).filter(Boolean),title:$('erTitle').value,note:$('erNote').value,date:today(),favorite:false,resolved:false,createdAt:new Date().toISOString()});save();render()}});document.querySelectorAll('[data-error-fav]').forEach(e=>e.onclick=()=>{const x=state.errors.find(q=>q.id===e.dataset.errorFav);x.favorite=!x.favorite;save();render()});document.querySelectorAll('[data-error-resolve]').forEach(e=>e.onclick=()=>{const x=state.errors.find(q=>q.id===e.dataset.errorResolve);x.resolved=!x.resolved;save();render()});document.querySelectorAll('[data-error-del]').forEach(e=>e.onclick=()=>{state.errors=state.errors.filter(q=>q.id!==e.dataset.errorDel);save();render()})}
function simValues(){const pt=clamp(+$('simPt').value||0,0,10),rl=clamp(+$('simRl').value||0,0,5),at=clamp(+$('simAt').value||0,0,5),ped=clamp(+$('simPed').value||0,0,10),fis=clamp(+$('simFis').value||0,0,30),basic=pt+rl+at+ped,total=basic+fis,percent=Math.round(total/60*100),ok=basic>=15&&fis>=15&&pt>0&&rl>0&&at>0&&ped>0&&fis>0;return {pt,rl,at,ped,fis,basic,total,percent,ok}}
function bindSim(){const prev=()=>{const s=simValues(),e=$('simPreview');e.className='sim-result '+(s.ok?'ok':'bad');e.innerHTML=`<b>${s.total}/60 • ${s.percent}%</b><br>Básicos ${s.basic}/30 • Física ${s.fis}/30 • ${s.ok?'critérios de treino atendidos':'há critério de treino não atendido'}`};['simPt','simRl','simAt','simPed','simFis'].forEach(id=>$(id).oninput=prev);prev();$('saveSim').onclick=()=>{const s=simValues();state.simulations.unshift({...s,id:uid(),physics:s.fis,minutes:+$('simMin').value||0,date:$('simDate').value,createdAt:new Date().toISOString()});save();render()}}
function bindDisc(){$('saveDisc').onclick=()=>{const lines=+$('discLines').value,score=+$('discScore').value;if(lines<0||score<0||score>10)return alert('Confira os valores.');state.discursives.unshift({id:uid(),theme:$('discTheme').value,lines,score,notes:$('discNotes').value,date:$('discDate').value,createdAt:new Date().toISOString()});save();render()}}
function bindPrac(){$('randomTheme').onclick=()=>{const arr=topics.filter(t=>t.discipline==='Física');$('pracTheme').value=arr[Math.floor(Math.random()*arr.length)].title};$('savePrac').onclick=()=>{const plan=+$('pracPlan').value,defense=+$('pracDefense').value;if(plan<0||plan>4||defense<0||defense>6)return alert('Plano vai de 0 a 4 e Defesa de 0 a 6.');state.practicals.unshift({id:uid(),theme:$('pracTheme').value,plan,defense,notes:$('pracNotes').value,date:$('pracDate').value,createdAt:new Date().toISOString()});save();render()}}

function bindHistory(){document.querySelectorAll('[data-htab]').forEach(e=>e.onclick=()=>{historyTab=e.dataset.htab;render()})}
function bindData(){$('installPwaBtn')?.addEventListener('click',async()=>{if(window.matchMedia?.('(display-mode: standalone)').matches)return toast('Rota da Aprovação já está instalada.');if(deferredInstallPrompt){deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;return}alert(location.protocol==='file:'?'Para instalar como PWA, abra o pacote via localhost ou HTTPS. O modo arquivo local continua funcionando normalmente.':'Use a opção de instalar aplicativo do seu navegador, se disponível.')});$('exportJson').onclick=exportBackupNow;$('quickBackup')?.addEventListener('click',exportBackupNow);$('runSelfTest')?.addEventListener('click',()=>{const r=runSelfTests();const box=$('selfTestBox');if(box)box.innerHTML=selfTestResultsHtml(r);toast(r.ok?'Todos os testes principais passaram.':'Há teste(s) que precisam de atenção.')});$('importJson').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const x=JSON.parse(await f.text());state=migrateState(x);save();applyTheme();render();toast('Backup importado e compatibilizado com a versão atual.')}catch(err){alert('Arquivo inválido.')}};$('exportCsv').onclick=exportAllCsv;$('clearData').onclick=()=>{if(confirm('Apagar todo o progresso local?')){localStorage.removeItem(APP_KEY);localStorage.removeItem(SNAP_KEY);idbClear();state=defaultState();save(true);render()}};$('saveSettings').onclick=()=>{state.settings.weeklyHoursGoal=+$('setHours').value||12;state.settings.weeklyQuestionsGoal=+$('setQuestions').value||180;state.settings.dailyMinutesGoal=+$('setDaily').value||120;state.settings.focusPreset=+$('setFocus').value||50;save();render();toast('Preferências salvas.')};document.querySelectorAll('[data-restore-snap]').forEach(e=>e.onclick=()=>{try{const snaps=JSON.parse(localStorage.getItem(SNAP_KEY)||'[]');state=migrateState(JSON.parse(snaps[+e.dataset.restoreSnap].data));save(true);render();toast('Snapshot restaurado e compatibilizado.')}catch(err){alert('Não foi possível restaurar.') }})}
function csv(rows){if(!rows.length)return '';const keys=Object.keys(rows[0]);return '\ufeff'+[keys.join(';'),...rows.map(r=>keys.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(';'))].join('\n')}
function download(name,content,type='text/plain'){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportQuestionCsv(){download('questoes-seduc-pa-'+today()+'.csv',csv(state.questionSessions),'text/csv;charset=utf-8')}
function exportAllCsv(){download('sessoes-estudo-'+today()+'.csv',csv(state.sessions),'text/csv;charset=utf-8');setTimeout(()=>exportQuestionCsv(),400)}
function openSearch(){$('searchLayer').classList.add('on');$('globalSearch').value='';$('globalSearch').placeholder='Buscar conteúdo ou digitar uma ação…';showCommandHome();$('globalSearch').focus()}

function showCommandHome(){const commands=[['Hoje','hoje','H'],['Estudar','estudarHub','S'],['Questões','questoesHub','Q'],['Revisões','revisao','R'],['Planejamento','planejamentoHub',''],['Dashboard','dashboard',''],['Diagnóstico','diagnostico',''],['Backup','dados','']];$('searchResults').innerHTML=`<div class="command-hint"><span>Ctrl K busca</span><span>H Hoje</span><span>S Estudar</span><span>Q Questões</span><span>R Revisões</span></div>${commands.map(([label,view,key])=>`<div class="search-result command" data-search-view="${view}"><small>AÇÃO ${key?`<span class="shortcut">${key}</span>`:''}</small><strong style="display:block">${label}</strong><small>Abrir área</small></div>`).join('')}`;bindSearchResults()}
function bindSearchResults(){document.querySelectorAll('[data-search-topic]').forEach(e=>e.onclick=()=>{timer.topicId=e.dataset.searchTopic;closeSearch();navigate('timer')});document.querySelectorAll('[data-search-view]').forEach(e=>e.onclick=()=>{closeSearch();navigate(e.dataset.searchView)})}
function hideSplash(){const s=$('splashScreen');if(!s)return;s.classList.add('hidden')}
function showSplash(){const s=$('splashScreen');if(!s)return;const logo=s.querySelector('.splash-logo');if(logo&&!logo.innerHTML.trim())logo.innerHTML=brandLogo(64);s.classList.remove('hidden');setTimeout(hideSplash,1700);$('enterAppBtn')?.addEventListener('click',hideSplash);$('skipSplashBtn')?.addEventListener('click',hideSplash)}
function doSearch(q){q=q.trim().toLowerCase();if(!q){showCommandHome();return}let res=[];const commands=[['hoje','Hoje'],['estudarHub','Estudar'],['questoesHub','Questões'],['planejamentoHub','Planejamento'],['dashboard','Dashboard'],['revisao','Revisões'],['flashcards','Flashcards'],['erros','Caderno de erros'],['simulados','Simulados'],['diagnostico','Diagnóstico'],['discursiva','Discursiva'],['pratica','Prova prática'],['dados','Backup e dados']];commands.filter(x=>x[1].toLowerCase().includes(q)).forEach(([view,label])=>res.push({kind:'Ação',title:label,sub:'Abrir área',view}));topics.filter(t=>(t.title+' '+t.group+' '+t.discipline+' '+(t.officialItem||'')).toLowerCase().includes(q)).slice(0,12).forEach(t=>res.push({kind:'Conteúdo',title:t.title,sub:t.discipline+' • '+t.group+' • '+(t.officialItem||''),action:t.id}));state.errors.filter(e=>(e.title+' '+e.note+' '+(e.tags||[]).join(' ')).toLowerCase().includes(q)).slice(0,6).forEach(e=>res.push({kind:'Erro',title:e.title||topics.find(t=>t.id===e.topicId)?.title,sub:e.note||e.reason,view:'erros'}));state.flashcards.filter(c=>(c.front+' '+c.back+' '+(c.tags||[]).join(' ')).toLowerCase().includes(q)).slice(0,6).forEach(c=>res.push({kind:'Flashcard',title:c.front,sub:c.back,view:'flashcards'}));state.formulas.filter(f=>(f.title+' '+f.formula+' '+f.note).toLowerCase().includes(q)).slice(0,6).forEach(f=>res.push({kind:'Fórmula',title:f.title,sub:f.formula,view:'formulas'}));$('searchResults').innerHTML=res.map(r=>`<div class="search-result" ${r.action?`data-search-topic="${r.action}"`:r.view?`data-search-view="${r.view}"`:''}><small>${r.kind}</small><strong style="display:block">${esc(r.title)}</strong><small>${esc(r.sub)}</small></div>`).join('')||'<div class="empty"><p>Nenhum resultado.</p></div>';bindSearchResults()}
function isTypingTarget(el){return el&&(['INPUT','TEXTAREA','SELECT'].includes(el.tagName)||el.isContentEditable)}
function handleGlobalKeys(e){if(e.key==='Escape'){closeSearch();$('fabMenu')?.classList.remove('on');return}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch();return}if(isTypingTarget(document.activeElement)||$('searchLayer').classList.contains('on')||(current==='diagnostico'&&state.diagnostic.draft))return;const k=e.key.toLowerCase();if(k==='h'){e.preventDefault();navigate('hoje')}else if(k==='s'){e.preventDefault();navigate('estudarHub')}else if(k==='q'){e.preventDefault();navigate('questoesHub')}else if(k==='r'){e.preventDefault();navigate('revisao')}}
document.addEventListener('keydown',handleGlobalKeys);document.addEventListener('click',e=>{if(!e.target.closest?.('.fab-wrap'))$('fabMenu')?.classList.remove('on')});
$('searchLayer').addEventListener('click',e=>{if(e.target===$('searchLayer'))closeSearch()});$('globalSearch').addEventListener('input',e=>doSearch(e.target.value));
